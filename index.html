<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ea">
<title>Stödassistenten – Pilot</title>
<style>
:root{--bg:#f7f3ea;--paper:#fffdf8;--ink:#26322e;--muted:#6e7772;--line:#e8dfd0;--sage:#35675c;--soft:#e9f1ed;--warm:#fff2d7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:14px 14px 80px}.top{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 12px}.logo{font-weight:900}.pilot{font-size:11px;background:var(--warm);padding:6px 9px;border-radius:999px}.card{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:20px;margin:10px 0;box-shadow:0 8px 25px #40372a12}.hero{padding:26px 21px}h1{font-size:36px;line-height:1.06;margin:5px 0 12px}h2{font-size:24px;margin:0 0 12px}p{line-height:1.5}.muted{color:var(--muted)}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--sage)}.langs{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.lang,.entry{font:inherit;border:1px solid var(--line);background:white;color:var(--ink);border-radius:17px;padding:13px;cursor:pointer;font-weight:750}.lang.active{background:var(--soft);border-color:#a9c5bb}.privacy{background:var(--soft);border-radius:15px;padding:11px;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.entry{display:block;text-decoration:none;text-align:start;min-height:92px}.entry strong{display:block;font-size:17px;margin-bottom:5px}.entry small{display:block;color:var(--muted);font-weight:600;line-height:1.35}.entry.primary{background:var(--soft);border-color:#b7cec5}.principle{font-size:14px;color:var(--muted);margin-top:12px}.rtl{direction:rtl;text-align:right}.rtl .entry{text-align:right}@media(max-width:560px){h1{font-size:31px}.grid{grid-template-columns:1fr}.app{padding-left:11px;padding-right:11px}}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.how div{background:#f4f6f0;border-radius:16px;padding:13px}.how b{display:block;margin-bottom:5px}.how small{color:var(--muted);line-height:1.4}@media(max-width:560px){.how{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="logo" id="logo">🧭 Stödassistenten</div><div class="pilot" id="pilot">Gemensam pilot</div></div>
  <main id="main"></main>
</div>
<script>
const COPY={
sv:{pilot:'Gemensam pilot',eyebrow:'En Stödassistenten – flera ingångar',hello:'Berätta vem du är och vad du försöker lösa.',sub:'Samma plattform ska hjälpa privatpersoner, anhöriga, studenter, anställda, företag och föreningar att hitta relevanta vägar och nästa steg.',privacy:'Piloten ska inte kräva att du känner till rätt bidragsnamn, myndighet eller upphandlingsbegrepp i förväg.',choose:'Välj den ingång som passar bäst',person:'Jag söker för mig själv',personD:'Ekonomi, arbete, sjukdom, boende eller annan livssituation',relative:'Jag hjälper någon',relativeD:'Anhörig eller annan person som behöver stöd att hitta rätt väg',student:'Student / ung vuxen',studentD:'Studier, nyexaminerad, första jobb, ekonomi eller boende',employee:'Anställd',employeeD:'Arbete, sjukskrivning, rättigheter eller stöd kring arbetslivet',company:'Företag',companyD:'Offentlig upphandling, finansiering och företagsstöd',association:'Förening',associationD:'Projekt, verksamhet, lokal, finansiering och offentliga möjligheter',other:'Annat',otherD:'Börja brett om ingen ingång passar exakt',principle:'En produkt. Ett sanningslager. Ett lärsystem. Olika ingångar får se olika ut, men ska leda in i samma Stödassistenten.'},
ar:{pilot:'نسخة تجريبية موحّدة',eyebrow:'مساعد دعم واحد – مداخل متعددة',hello:'أخبرنا من أنت وما الذي تحاول حله.',sub:'نفس المنصة تساعد الأفراد والأقارب والطلاب والموظفين والشركات والجمعيات على العثور على مسارات مناسبة والخطوة التالية.',privacy:'لا يفترض أن تعرف مسبقاً اسم الدعم أو الجهة أو مصطلحات المشتريات الصحيحة.',choose:'اختر المدخل الأنسب',person:'أبحث لنفسي',personD:'الاقتصاد أو العمل أو المرض أو السكن أو حالة حياتية أخرى',relative:'أساعد شخصاً آخر',relativeD:'قريب أو شخص آخر يحتاج مساعدة للوصول إلى المسار الصحيح',student:'طالب / شاب بالغ',studentD:'الدراسة أو التخرج أو أول وظيفة أو الاقتصاد أو السكن',employee:'موظف',employeeD:'العمل أو الإجازة المرضية أو الحقوق أو دعم الحياة المهنية',company:'شركة',companyD:'المشتريات العامة والتمويل ودعم الشركات',association:'جمعية',associationD:'المشاريع والنشاط والمقر والتمويل والفرص العامة',other:'أمر آخر',otherD:'ابدأ بشكل واسع إذا لم يناسبك أي مدخل تماماً',principle:'منتج واحد. مصدر حقيقة واحد. نظام تعلم واحد. قد تختلف المداخل في الشكل، لكنها تقود إلى نفس مساعد الدعم.'},
fa:{pilot:'پایلوت یکپارچه',eyebrow:'یک دستیار حمایت – چند ورودی',hello:'بگو چه کسی هستی و می‌خواهی چه مسئله‌ای را حل کنی.',sub:'همان پلتفرم باید به افراد، بستگان، دانشجویان، کارکنان، شرکت‌ها و انجمن‌ها کمک کند مسیرهای مرتبط و قدم بعدی را پیدا کنند.',privacy:'لازم نیست از قبل نام دقیق حمایت، نهاد یا اصطلاحات مناقصه را بدانید.',choose:'ورودی مناسب را انتخاب کنید',person:'برای خودم جست‌وجو می‌کنم',personD:'اقتصاد، کار، بیماری، مسکن یا وضعیت زندگی دیگر',relative:'به شخص دیگری کمک می‌کنم',relativeD:'خویشاوند یا فرد دیگری که برای پیدا کردن مسیر درست کمک می‌خواهد',student:'دانشجو / جوان',studentD:'تحصیل، فارغ‌التحصیلی، اولین کار، اقتصاد یا مسکن',employee:'کارمند',employeeD:'کار، مرخصی بیماری، حقوق یا حمایت‌های مربوط به زندگی کاری',company:'شرکت',companyD:'مناقصه عمومی، تأمین مالی و حمایت‌های کسب‌وکار',association:'انجمن',associationD:'پروژه، فعالیت، محل، تأمین مالی و فرصت‌های عمومی',other:'سایر',otherD:'اگر هیچ ورودی دقیقاً مناسب نیست، گسترده شروع کنید',principle:'یک محصول. یک لایه حقیقت. یک سیستم یادگیری. ورودی‌ها می‌توانند متفاوت باشند اما همگی به همان دستیار حمایت می‌رسند.'}
};
let lang=new URLSearchParams(location.search).get('lang');
if(!COPY[lang]) lang='sv';
const tr=k=>COPY[lang][k]||k;
const HOW_COPY={
sv:{title:'Så hjälper Stödassistenten dig',a:'1. Berätta situationen',ad:'Börja med vem du är och vad som faktiskt händer – inte namnet på ett stöd.',b:'2. Få relevanta vägar',bd:'Vi visar möjliga stöd, rättigheter, tjänster eller möjligheter som är värda att kontrollera.',c:'3. Gå till nästa handling',cd:'Öppna originalkällan, kontrollera villkor och se vad du behöver göra eller ha redo.'},
ar:{title:'كيف يساعدك مساعد الدعم',a:'1. اشرح الوضع',ad:'ابدأ بمن أنت وما الذي يحدث فعلاً، وليس باسم دعم معين.',b:'2. احصل على مسارات مناسبة',bd:'نعرض دعماً أو حقوقاً أو خدمات أو فرصاً تستحق التحقق.',c:'3. انتقل إلى الخطوة التالية',cd:'افتح المصدر الأصلي وتحقق من الشروط وما الذي تحتاج إلى فعله أو تجهيزه.'},
fa:{title:'دستیار حمایت چگونه کمک می‌کند',a:'1. شرایط را بگو',ad:'با این شروع کن که چه کسی هستی و واقعاً چه اتفاقی افتاده، نه نام یک حمایت.',b:'2. مسیرهای مرتبط را ببین',bd:'حمایت‌ها، حقوق، خدمات یا فرصت‌هایی را که ارزش بررسی دارند نشان می‌دهیم.',c:'3. قدم بعدی را بردار',cd:'منبع اصلی را باز کن، شرایط را بررسی کن و ببین چه کاری یا چه مدارکی لازم است.'}
};
function howSection(){const h=HOW_COPY[lang]||HOW_COPY.sv;return `<section class="card"><h2>${h.title}</h2><div class="how"><div><b>${h.a}</b><small>${h.ad}</small></div><div><b>${h.b}</b><small>${h.bd}</small></div><div><b>${h.c}</b><small>${h.cd}</small></div></div></section>`}
function target(actor){return actor==='company'?`company-pilot.html?actor_type=${actor}&lang=${lang}`:`person-pilot.html?actor_type=${actor}&lang=${lang}`}
function entry(actor,title,desc,primary=false){return `<a class="entry ${primary?'primary':''}" href="${target(actor)}"><strong>${tr(title)}</strong><small>${tr(desc)}</small></a>`}
function setLanguage(nextLang){
  if(!COPY[nextLang]) return;
  lang=nextLang;
  const url=new URL(location.href);
  url.searchParams.set('lang',lang);
  history.replaceState(null,'',url);
  render();
}
function bindLanguageButtons(){
  document.querySelectorAll('.lang[data-lang]').forEach(button=>{
    button.addEventListener('click',()=>setLanguage(button.dataset.lang));
  });
}
function render(){
  const rtl=lang==='ar'||lang==='fa';
  document.documentElement.lang=lang;
  document.documentElement.dir=rtl?'rtl':'ltr';
  document.body.classList.toggle('rtl',rtl);
  document.getElementById('pilot').textContent=tr('pilot');
  document.getElementById('main').innerHTML=`<section class="card hero"><div class="eyebrow">${tr('eyebrow')}</div><h1>${tr('hello')}</h1><p class="muted">${tr('sub')}</p><div class="langs">${[['sv','Svenska'],['ar','العربية'],['fa','فارسی']].map(x=>`<button type="button" class="lang ${lang===x[0]?'active':''}" data-lang="${x[0]}" aria-pressed="${lang===x[0]?'true':'false'}">${x[1]}</button>`).join('')}</div><div class="privacy">🔒 ${tr('privacy')}</div></section><section class="card"><h2>${tr('choose')}</h2><div class="grid">${entry('private_person','person','personD',true)}${entry('relative','relative','relativeD')}${entry('student','student','studentD')}${entry('employee','employee','employeeD')}${entry('company','company','companyD')}${entry('association','association','associationD')}${entry('other','other','otherD')}</div><div class="principle">${tr('principle')}</div></section>${howSection()}`;
  bindLanguageButtons();
}
render();
</script>
</body>
</html>
