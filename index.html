working:[['Ekonomiskt stöd vid pressad ekonomi','Även personer som arbetar kan i vissa situationer behöva kontrollera andra stödvägar. Kommunalt ekonomiskt bistånd bedöms utifrån hela hushållets ekonomi.','https://www.socialstyrelsen.se/kunskapsstod-och-regler/omraden/ekonomiskt-bistand/'],['Lokala stiftelser','Vid ett konkret behov kan vissa lokala stiftelser vara värda att kontrollera. Villkoren varierar mellan stiftelser.','https://stiftelser.lansstyrelsen.se/']],
student:[['CSN – tillägg och särskilda stöd','Beroende på familjesituation, ålder och behov kan det finnas tillägg eller andra delar av studiestödet att kontrollera.','https://www.csn.se/bidrag-och-lan/studiestod.html'],['Ekonomiskt stöd vid pressad ekonomi','Vid mycket pressad ekonomi kan andra stödvägar behöva kontrolleras beroende på hushållets situation.','https://www.socialstyrelsen.se/kunskapsstod-och-regler/omraden/ekonomiskt-bistand/']],
other:[['Kommunal vägledning och ekonomiskt bistånd','Om inget färdigt exempel passar kan kommunen vara en viktig väg för att kontrollera vilket stöd eller vilken rådgivning som finns lokalt.','https://www.socialstyrelsen.se/kunskapsstod-och-regler/omraden/ekonomiskt-bistand/'],['Lokala stiftelser','Vid konkreta behov kan lokala stiftelser vara värda att kontrollera.','https://stiftelser.lansstyrelsen.se/']]
};
let lang='sv',screen='home',scenario=null,answers={},matchRatings={},finalFeedback={},submitState='idle';
const tr=k=>T[lang][k]||k, main=()=>document.getElementById('main');
function setLang(l){lang=l;document.documentElement.lang=l;document.body.classList.toggle('rtl',l==='ar'||l==='fa');render()}
function go(s){screen=s;render();window.scrollTo({top:0,behavior:'smooth'})}
function chooseAnswer(key,val,next){answers[key]=val;go(next)}
function start(s){scenario=s;answers={};matchRatings={};finalFeedback={};submitState='idle';go(s==='general'?'general1':s+'1')}
function back(prev='home'){return `<button class="back" onclick="go('${prev}')">${lang==='sv'?'←':'→'} ${tr('back')}</button>`}
function btn(label,next,key,val){const action=key?`chooseAnswer('${key}','${val}','${next}')`:`go('${next}')`;return `<button class="choice" onclick="${action}">${label}</button>`}
function q(title,opts,prev,step){return `${back(prev)}<section class="card">${step?`<div class="progress">${step}</div>`:''}<h2>${tr(title)}</h2>${opts.map(o=>btn(tr(o[0]),o[1],o[2],o[3])).join('')}</section>`}
function home(){return `<section class="card hero"><div class="eyebrow">${tr('eyebrow')}</div><h1>${tr('hello')}</h1><p class="muted">${tr('sub')}</p><div class="langs">${[['sv','Svenska'],['ar','العربية'],['fa','فارسی']].map(x=>`<button class="lang ${lang===x[0]?'active':''}" onclick="setLang('${x[0]}')">${x[1]}</button>`).join('')}</div><div class="privacy">🔒 ${tr('privacy')}</div></section><section class="card"><h2>${tr('choose')}</h2><button class="demo general" onclick="start('general')">${tr('general')}<small>${tr('generalD')}</small></button><button class="demo" onclick="start('pension')">${tr('pension')}<small>${tr('pensionD')}</small></button><button class="demo" onclick="start('family')">${tr('family')}<small>${tr('familyD')}</small></button><button class="demo" onclick="start('org')">${tr('org')}<small>${tr('orgD')}</small></button></section><section class="card"><h3>${lang==='sv'?'Till exempel':lang==='ar'?'مثلاً':'مثلاً'}</h3><div class="example">${tr('ex1')}</div><div class="example">${tr('ex2')}</div><div class="example">${tr('ex3')}</div></section>`}
function flow(){
 if(screen==='pension1')return q('area',[['bigCity','pension2','area','big'],['midTown','pension2','area','mid'],['smallTown','pension2','area','small'],['areaUnknown','pension2','area','unknown']],'home','1 / 3');
 if(screen==='pension2')return q('alone',[['yes','pension3','alone','yes'],['no','pension3','alone','no'],['unsure','pension3','alone','unsure']],'pension1','2 / 3');
 if(screen==='pension3')return q('dental',[['yes','pensionR','dental','yes'],['no','pensionR','dental','no'],['unsure','pensionR','dental','unsure']],'pension2','3 / 3');
 if(screen==='family1')return q('childAge',[['yes','family2','child','yes'],['no','family2','child','no'],['unsure','family2','child','unsure']],'home','1 / 2');
 if(screen==='family2')return q('extra',[['morning','familyR','extra','morning'],['supervision','familyR','extra','supervision'],['school','familyR','extra','school']],'family1','2 / 2');
 if(screen==='org1')return q('orgType',[['association','org2','orgType','association'],['company','org2','orgType','company']],'home','1 / 2');
 if(screen==='org2')return q('orgNeed',[['funding','orgR','orgNeed','funding'],['facility','orgR','orgNeed','facility'],['procurement','orgR','orgNeed','procurement']],'org1','2 / 2');
 if(screen==='general1')return q('workStatus',[['full','general2','work','full'],['part','general2','work','part'],['sickPart','general2','work','sickPart'],['sickFull','general2','work','sickFull'],['unemployed','general2','work','unemployed'],['akassa','general2','work','akassa'],['student','general2','work','student'],['other','general2','work','other']],'home','1 / 5');
 if(screen==='general2')return q('money',[['tight','general3','money','tight'],['someTight','general3','money','some'],['ok','general3','money','ok']],'general1','2 / 5');
 if(screen==='general3')return q('children',[['yes','general4','children','yes'],['no','general4','children','no'],['unsure','general4','children','unsure']],'general2','3 / 5');
 if(screen==='general4')return q('healthImpact',[['yes','general5','health','yes'],['no','general5','health','no'],['unsure','general5','health','unsure']],'general3','4 / 5');
 if(screen==='general5')return q('housing',[['yes','generalR','housing','yes'],['no','generalR','housing','no'],['unsure','generalR','housing','unsure']],'general4','5 / 5');
}
function getRows(){if(scenario!=='general')return S[scenario];const w=answers.work;let rows;if(w==='sickPart'||w==='sickFull')rows=[...G.sick];else if(w==='unemployed'||w==='akassa')rows=[...G.unemployed];else if(w==='student')rows=[...G.student];else if(w==='full'||w==='part')rows=[...G.working];else rows=[...G.other];if(answers.money!=='ok'&&!rows.some(r=>r[0].includes('Ekonomiskt stöd')))rows.push(G.other[0]);if(answers.money!=='ok'&&!rows.some(r=>r[0].includes('Lokala stiftelser')))rows.push(G.other[1]);return rows.slice(0,4)}
function setMatch(i,val){matchRatings['m'+(i+1)]=val;submitState='idle';render()}
function setFinal(key,val){finalFeedback[key]=val;submitState='idle';render()}
function finalQuestion(key,label){return `<div class="finalq"><b>${tr(label)}</b><div class="fbs"><button class="fb ${finalFeedback[key]===true?'selected':''}" onclick="setFinal('${key}',true)">${tr('yes')}</button><button class="fb ${finalFeedback[key]===false?'selected':''}" onclick="setFinal('${key}',false)">${tr('no')}</button></div></div>`}
function resultCard(r,i){return `<article class="result"><div class="rhead"><b>${r[0]}</b><span class="tag">${tr(i<2?'good':'check')}</span></div><p>${r[1]}</p><div class="info"><b>${tr('why')}</b><br>${r[1]}</div><a class="source" target="_blank" rel="noopener" href="${r[2]}">↗ ${tr('source')}</a><div class="feedback"><small>${tr('feedback')}</small><div class="fbs"><button class="fb ${matchRatings['m'+(i+1)]===5?'selected':''}" onclick="setMatch(${i},5)">${tr('rel')}</button><button class="fb ${matchRatings['m'+(i+1)]===3?'selected':''}" onclick="setMatch(${i},3)">${tr('known')}</button><button class="fb ${matchRatings['m'+(i+1)]===1?'selected':''}" onclick="setMatch(${i},1)">${tr('notrel')}</button></div></div></article>`}
function statusHtml(){if(submitState==='sending')return `<div class="status">${tr('sending')}</div>`;if(submitState==='sent')return `<div class="status ok">✓ ${tr('sent')} ${tr('thanks')}</div>`;if(submitState==='error')return `<div class="status err">${tr('sendError')}</div>`;if(submitState==='missing')return `<div class="status err">${tr('needAnswers')}</div>`;return ''}
function results(){const rows=getRows();return `${back()}<section class="card"><h1>${tr('results')}</h1><div class="notice">${tr('disclaimer')}</div></section>${rows.map(resultCard).join('')}<section class="card"><h2>${tr('finish')}</h2>${finalQuestion('new','newQ')}${finalQuestion('useful','usefulQ')}${finalQuestion('clear','clearQ')}<div class="summary">🔒 ${tr('sendNote')}</div><button class="btn primary share" ${submitState==='sending'||submitState==='sent'?'disabled':''} onclick="submitFeedback()">${tr('send')}</button>${statusHtml()}</section>`}
async function submitFeedback(){if(typeof finalFeedback.new!=='boolean'||typeof finalFeedback.useful!=='boolean'||typeof finalFeedback.clear!=='boolean'){submitState='missing';render();return}submitState='sending';render();const payload={app_version:APP_VERSION,language:lang,flow:scenario,learned_new:finalFeedback.new,useful:finalFeedback.useful,next_step_clear:finalFeedback.clear,ratings:matchRatings};try{const res=await fetch(FEEDBACK_ENDPOINT,{method:'POST',mode:'cors',credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!res.ok)throw new Error('HTTP '+res.status);submitState='sent'}catch(e){submitState='error'}render()}
function render(){document.getElementById('logo').textContent=tr('app');document.getElementById('pilot').textContent=tr('pilot');if(screen==='home')main().innerHTML=home();else if(screen.endsWith('R'))main().innerHTML=results();else main().innerHTML=flow()||home()}
render();
</script>
</body>
</html>
