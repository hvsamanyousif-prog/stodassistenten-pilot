function setLang(next){if(!I18N[next])return;lang=next;const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u);render();}
function score(text,key){const hay=text.toLowerCase();return KEYWORDS[key].reduce((n,w)=>n+(hay.includes(w.toLowerCase())?1:0),0)}
function explicitHelperRole(text){const x=String(text||'').toLowerCase();const sv=/\bjag\s+hjälper\s+(?:mitt\s+barn|min\s+(?:barn|son|dotter|mamma|pappa|mor|far|partner|syster|bror|syskon|vän)|henne|honom)\b/u.test(x)&&!/\bjag\s+hjälper\s+inte\b/u.test(x);const ar=/أساعد\s+(?:طفلي|ابني|ابنتي|أمي|أبي|أخي|أختي|صديقي|صديقتي|زوجي|زوجتي)/u.test(x)&&!/(?:لا\s+أساعد|لم\s+أعد\s+أساعد)/u.test(x);const fa=/(?:به\s+)?(?:فرزندم|پسرم|دخترم|مادرم|پدرم|همسرم|خواهرم|برادرم|دوستم)[^.!؟\n]{0,80}کمک\s+می(?:‌|\s)?کنم/u.test(x)&&!/کمک\s+نمی(?:‌|\s)?کنم/u.test(x);return sv||ar||fa;}
function classify(text){const normalized=String(text||'').toLowerCase();const explicitPrivateCorrection=(/\bjag\s+har\s+inget\s+företag\b/u.test(normalized)&&/\bjag\s+är\s+privatperson\b/u.test(normalized))||(/ليس\s+لدي\s+شركة/u.test(normalized)&&/أنا\s+فرد/u.test(normalized))||(/شرکت\s+ندارم/u.test(normalized)&&/(?:من\s+)?فرد\s+هستم/u.test(normalized));let ranked=Object.keys(KEYWORDS).map(k=>[k,score(text,k)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);if(explicitPrivateCorrection){ranked=ranked.filter(k=>k!=='company');if(!ranked.includes('economy'))ranked.unshift('economy')}if(explicitHelperRole(text))ranked=['relative',...ranked.filter(k=>k!=='relative')];if(!ranked.length)return ['general'];if(ranked[0]==='vision'&&!ranked.includes('economy'))ranked.push('economy');if(ranked[0]==='dental'&&!ranked.includes('economy'))ranked.push('economy');return [...new Set(ranked.concat('general'))].slice(0,3)}
function coarseNeed(mode,text){
  const x=String(text||'').toLowerCase();
  if(mode==='dental'){
    if(/kost|råd|peng|dyr|ekonomi|stöd|bidrag|högkost|اقتص|مال|هزینه|پول/.test(x))return 'cost';
    if(/ont|värk|smärt|akut|svull|besvär|درد|وجع/.test(x))return 'care';
    if(/stöd|bidrag|högkost|حمایت|دعم/.test(x))return 'support';
    return 'unsure';
  }
  if(mode==='vision'){
    if(/hem|bostad|lägen|trösk|kök|belys|خانه|منزل/.test(x))return 'home';
    if(/mobil|dator|läsa|skärm|voiceover|hjälpmedel|تلفن|رایانه|خواندن/.test(x))return 'tech';
    if(/jobb|arbete|skola|stud|کار|تحصیل|عمل|دراسة/.test(x))return 'work';
    return 'unsure';
  }
  return 'unsure';
}
function routeHtml(key,text){const r=key==='relative'?t().actorsData[1]:(t().routes[key]||t().routes.general);let href=hrefWithLang(r[2]);if((key==='dental'||key==='vision')&&text){const u=new URL(href,location.href);u.searchParams.set('need',coarseNeed(key,text));href=u.pathname.split('/').pop()+u.search;}return `<a class="route" href="${href}"><span><strong>${r[0]}</strong><small>${r[1]}</small></span><span class="arrow" aria-hidden="true">→</span></a>`}
function analyze(){const text=document.getElementById('situation').value.trim();const keys=classify(text);const matched=Boolean(text)&&keys.some(k=>k!=='general');const box=document.getElementById('engineResults');box.innerHTML=`<div class="interpret">${matched?t().interp:t().fallback}</div>${keys.map(k=>routeHtml(k,text)).join('')}`;box.hidden=false;box.scrollIntoView({behavior:'smooth',block:'nearest'});}
function renderPaths(){const keys=['dental','vision','work','economy','study','company','association','general'];const icons={dental:'◉',vision:'◐',work:'↗',economy:'¤',study:'◇',company:'▣',association:'◎',general:'+'};return keys.map(k=>{const r=t().routes[k];return `<a class="path" href="${hrefWithLang(r[2])}"><span class="icon" aria-hidden="true">${icons[k]}</span><b>${r[0]}</b><small>${r[1]}</small></a>`}).join('')}
function renderActors(){return `<div><h2>${t().actors}</h2><p>${t().actorSub}</p></div>${t().actorsData.map(a=>`<a class="actorlink" href="${hrefWithLang(a[2])}"><span>${a[0]}<small>${a[1]}</small></span><span aria-hidden="true">→</span></a>`).join('')}`}
function render(){const rtl=lang==='ar'||lang==='fa';document.documentElement.lang=lang;document.documentElement.dir=rtl?'rtl':'ltr';document.body.classList.toggle('rtl',rtl);document.getElementById('statusText').textContent=t().status;document.querySelectorAll('.lang').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));document.getElementById('eyebrow').textContent=t().eyebrow;document.getElementById('headline').innerHTML=t().headline;document.getElementById('lead').textContent=t().lead;['trust1','trust2','trust3'].forEach(id=>document.getElementById(id).textContent=t()[id]);document.getElementById('assistantEyebrow').textContent=t().ae;document.getElementById('assistantTitle').textContent=t().at;document.getElementById('assistantSub').textContent=t().as;document.getElementById('engineBadge').textContent=t().badge;document.getElementById('situation').placeholder=t().placeholder;document.getElementById('privacyText').textContent=t().privacy;document.getElementById('analyzeBtn').textContent=t().analyze;document.getElementById('examples').innerHTML=t().examples.map(x=>`<button class="chip" type="button">${x}</button>`).join('');document.querySelectorAll('.chip').forEach((b,i)=>b.onclick=()=>{document.getElementById('situation').value=t().examples[i];analyze()});document.getElementById('pathsTitle').textContent=t().paths;document.getElementById('pathsIntro').textContent=t().pathsIntro;document.getElementById('pathGrid').innerHTML=renderPaths();document.getElementById('actorBar').innerHTML=renderActors();document.getElementById('principle').textContent=t().principle;document.getElementById('engineResults').hidden=true;}
document.querySelectorAll('.lang').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));document.getElementById('analyzeBtn').addEventListener('click',analyze);document.getElementById('situation').addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')analyze()});render();
</script>
</body>
