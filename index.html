<title>Stödassistenten – Pilot</title>
<style>
:root{--bg:#f7f3ea;--paper:#fffdf8;--ink:#26322e;--muted:#6e7772;--line:#e8dfd0;--sage:#35675c;--soft:#e9f1ed;--warm:#fff2d7;--rose:#fff0ea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:620px;margin:auto;padding:14px 14px 100px}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 12px}
.logo{font-weight:900}.pilot{font-size:11px;background:var(--warm);padding:6px 9px;border-radius:999px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:19px;margin:10px 0;box-shadow:0 8px 25px #40372a12}
.hero{padding:23px 19px}
h1{font-size:34px;line-height:1.06;margin:4px 0 10px}h2{font-size:24px;margin:0 0 12px}h3{margin:0 0 8px}
p{line-height:1.5}.muted{color:var(--muted)}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--sage)}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:15px 0}
.lang,.choice,.demo,.btn,.fb,.mini{font:inherit;border:1px solid var(--line);background:white;color:var(--ink);border-radius:16px;padding:13px;cursor:pointer;font-weight:750}
.lang.active{background:var(--soft);border-color:#a9c5bb}.primary{background:var(--sage);color:white;border:0;width:100%}
.demo{width:100%;text-align:start;margin:6px 0}.demo small{display:block;color:var(--muted);margin-top:3px;font-weight:600}
.demo.general{background:var(--soft);border-color:#b7cec5}
.choice{display:block;width:100%;text-align:start;margin:8px 0}
.back{border:0;background:none;color:var(--sage);font-weight:800;padding:6px 0;cursor:pointer}
.notice{background:var(--warm);border-radius:15px;padding:11px;font-size:13px}.privacy{background:var(--soft);border-radius:15px;padding:11px;font-size:13px}
.example{background:#f4f6f0;border-radius:14px;padding:11px;margin:8px 0;font-size:14px}
.result{border:1px solid var(--line);background:white;border-radius:19px;padding:15px;margin:9px 0}
.rhead{display:flex;justify-content:space-between;gap:8px}.tag{background:var(--soft);color:#28584c;border-radius:999px;padding:5px 7px;font-size:11px;font-weight:900;white-space:nowrap}
.result p{font-size:14px;color:var(--muted)}.info{background:#f4f6f0;border-radius:13px;padding:10px;font-size:13px;margin:7px 0}
.feedback{border-top:1px solid var(--line);padding-top:9px;margin-top:9px}.fbs{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.fb{font-size:12px;padding:8px 10px}.fb.selected{background:var(--soft);border-color:#8fb5a8}
.source{color:var(--sage);font-weight:800;text-decoration:none;font-size:13px}.share{margin-top:14px}
.finalq{margin:14px 0;padding:14px;background:#f8f5ef;border-radius:18px}.finalq b{display:block;margin-bottom:7px}
.summary{background:var(--rose);padding:12px;border-radius:15px;font-size:13px}
.progress{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:7px}
.rtl{direction:rtl;text-align:right}.rtl .demo,.rtl .choice{text-align:right}.rtl .rhead{flex-direction:row-reverse}
@media(max-width:420px){h1{font-size:30px}.langs{grid-template-columns:1fr}.app{padding-left:11px;padding-right:11px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="logo" id="logo"></div><div class="pilot" id="pilot"></div></div>
  <main id="main"></main>
</div>

  ['CSN – tillägg och särskilda stöd','Beroende på familjesituation, ålder och behov kan det finnas tillägg eller andra delar av studiestödet att kontrollera.','https://www.csn.se/bidrag-och-lan/studiestod.html'],
  ['Ekonomiskt stöd vid pressad ekonomi','Vid mycket pressad ekonomi kan andra stödvägar behöva kontrolleras beroende på hushållets situation.','https://www.socialstyrelsen.se/kunskapsstod-och-regler/omraden/ekonomiskt-bistand/']
 ],
 other:[
  ['Kommunal vägledning och ekonomiskt bistånd','Om inget färdigt exempel passar kan kommunen vara en viktig väg för att kontrollera vilket stöd eller vilken rådgivning som finns lokalt.','https://www.socialstyrelsen.se/kunskapsstod-och-regler/omraden/ekonomiskt-bistand/'],
  ['Lokala stiftelser','Vid konkreta behov kan lokala stiftelser vara värda att kontrollera.','https://stiftelser.lansstyrelsen.se/']
 ]
};

let lang='sv',screen='home',scenario=null,answers={},feedback={},finalFeedback={};
const tr=k=>T[lang][k]||k;
const main=()=>document.getElementById('main');

function setLang(l){
 lang=l;
 document.documentElement.lang=l;
 document.body.classList.toggle('rtl',l==='ar'||l==='fa');
 render();
}
function go(s){screen=s;render();window.scrollTo({top:0,behavior:'smooth'})}
function chooseAnswer(key,val,next){answers[key]=val;go(next)}
function start(s){scenario=s;answers={};feedback={};finalFeedback={};go(s==='general'?'general1':s+'1')}

function back(prev='home'){
 return `<button class="back" onclick="go('${prev}')">${lang==='sv'?'←':'→'} ${tr('back')}</button>`
}
function btn(label,next,key,val){
 const action=key?`chooseAnswer('${key}','${val}','${next}')`:`go('${next}')`;
 return `<button class="choice" onclick="${action}">${label}</button>`;
}
function q(title,opts,prev,step){
 return `${back(prev)}<section class="card">${step?`<div class="progress">${step}</div>`:''}<h2>${tr(title)}</h2>${opts.map(o=>btn(tr(o[0]),o[1],o[2],o[3])).join('')}</section>`;
}

function home(){
 return `<section class="card hero">
 <div class="eyebrow">${tr('eyebrow')}</div>
 <h1>${tr('hello')}</h1>
 <p class="muted">${tr('sub')}</p>
 <div class="langs">
   ${[['sv','Svenska'],['ar','العربية'],['fa','فارسی']].map(x=>`<button class="lang ${lang===x[0]?'active':''}" onclick="setLang('${x[0]}')">${x[1]}</button>`).join('')}
 </div>
 <div class="privacy">🔒 ${tr('privacy')}</div>
 </section>
 <section class="card">
 <h2>${tr('choose')}</h2>
 <button class="demo general" onclick="start('general')">${tr('general')}<small>${tr('generalD')}</small></button>
 <button class="demo" onclick="start('pension')">${tr('pension')}<small>${tr('pensionD')}</small></button>
 <button class="demo" onclick="start('family')">${tr('family')}<small>${tr('familyD')}</small></button>
 <button class="demo" onclick="start('org')">${tr('org')}<small>${tr('orgD')}</small></button>
 </section>
 <section class="card">
 <h3>${lang==='sv'?'Till exempel':lang==='ar'?'مثلاً':'مثلاً'}</h3>
 <div class="example">${tr('ex1')}</div><div class="example">${tr('ex2')}</div><div class="example">${tr('ex3')}</div>
 </section>`;
}

function flow(){
 if(screen==='pension1') return q('municipality',[['next','pension2','area','unknown']],'home','1 / 3');
 if(screen==='pension2') return q('alone',[['yes','pension3','alone','yes'],['no','pension3','alone','no'],['unsure','pension3','alone','unsure']],'pension1','2 / 3');
 if(screen==='pension3') return q('dental',[['yes','pensionR','dental','yes'],['no','pensionR','dental','no'],['unsure','pensionR','dental','unsure']],'pension2','3 / 3');
 if(screen==='family1') return q('childAge',[['yes','family2','child','yes'],['no','family2','child','no'],['unsure','family2','child','unsure']],'home','1 / 2');
 if(screen==='family2') return q('extra',[['morning','familyR','extra','morning'],['supervision','familyR','extra','supervision'],['school','familyR','extra','school']],'family1','2 / 2');
 if(screen==='org1') return q('orgType',[['association','org2','orgType','association'],['company','org2','orgType','company']],'home','1 / 2');
 if(screen==='org2') return q('orgNeed',[['funding','orgR','orgNeed','funding'],['facility','orgR','orgNeed','facility'],['procurement','orgR','orgNeed','procurement']],'org1','2 / 2');

 if(screen==='general1') return q('workStatus',[
   ['full','general2','work','full'],['part','general2','work','part'],['sickPart','general2','work','sickPart'],['sickFull','general2','work','sickFull'],
   ['unemployed','general2','work','unemployed'],['akassa','general2','work','akassa'],['student','general2','work','student'],['other','general2','work','other']
 ],'home','1 / 5');
 if(screen==='general2') return q('money',[['tight','general3','money','tight'],['someTight','general3','money','some'],['ok','general3','money','ok']],'general1','2 / 5');
 if(screen==='general3') return q('children',[['yes','general4','children','yes'],['no','general4','children','no'],['unsure','general4','children','unsure']],'general2','3 / 5');
 if(screen==='general4') return q('healthImpact',[['yes','general5','health','yes'],['no','general5','health','no'],['unsure','general5','health','unsure']],'general3','4 / 5');
 if(screen==='general5') return q('housing',[['yes','generalR','housing','yes'],['no','generalR','housing','no'],['unsure','generalR','housing','unsure']],'general4','5 / 5');
}

function getRows(){
 if(scenario!=='general') return S[scenario];
 const w=answers.work;
 let rows;
 if(w==='sickPart'||w==='sickFull') rows=[...generalSupports.sick];
 else if(w==='unemployed'||w==='akassa') rows=[...generalSupports.unemployed];
 else if(w==='student') rows=[...generalSupports.student];
 else if(w==='full'||w==='part') rows=[...generalSupports.working];
 else rows=[...generalSupports.other];

 if(answers.money!=='ok' && !rows.some(r=>r[0].includes('Ekonomiskt stöd'))) {
   rows.push(generalSupports.other[0]);
 }
 if(answers.money!=='ok' && !rows.some(r=>r[0].includes('Lokala stiftelser'))) {
   rows.push(generalSupports.other[1]);
 }
 return rows.slice(0,4);
}

function fb(id,val){feedback[id]=val;render()}
function setFinal(key,val){finalFeedback[key]=val;render()}

function finalQuestion(key,label){
 const vals=[['yesNew','yes'],['some','some'],['noNew','no']];
 return `<div class="finalq"><b>${tr(label)}</b><div class="fbs">${vals.map(v=>`<button class="fb ${finalFeedback[key]===v[1]?'selected':''}" onclick="setFinal('${key}','${v[1]}')">${tr(v[0])}</button>`).join('')}</div></div>`;
}

function results(){
 const rows=getRows();
 return `${back()}<section class="card"><h1>${tr('results')}</h1><div class="notice">${tr('disclaimer')}</div></section>
 ${rows.map((r,i)=>`<article class="result">
   <div class="rhead"><b>${r[0]}</b><span class="tag">${tr(i<2?'good':'check')}</span></div>
   <p>${r[1]}</p>
   <div class="info"><b>${tr('why')}</b><br>${r[1]}</div>
   <a class="source" target="_blank" rel="noopener" href="${r[2]}">↗ ${tr('source')}</a>
   <div class="feedback"><small>${tr('feedback')}</small><div class="fbs">
    ${[['rel','rel'],['known','known'],['notrel','notrel']].map(v=>`<button class="fb ${feedback[r[0]]===v[1]?'selected':''}" onclick="fb(${JSON.stringify(r[0])},'${v[1]}')">${tr(v[0])}</button>`).join('')}
   </div></div>
 </article>`).join('')}
 <section class="card"><h2>${tr('finish')}</h2>
 ${finalQuestion('new','newQ')}
 ${finalQuestion('useful','usefulQ')}
 ${finalQuestion('clear','clearQ')}
 <div class="summary">${tr('shareNote')}</div>
 <button class="btn primary share" onclick="shareFeedback()">${tr('share')}</button>
 </section>`;
}

async function shareFeedback(){
 const ratings=Object.entries(feedback).map(([support,rating])=>({support,rating}));
 const data={
   pilot:'v0.4',
   language:lang,
   scenario,
   ratings,
   experience:finalFeedback,
   timestamp:new Date().toISOString()
 };
 const text='Stödassistenten – anonym pilotfeedback\n'+JSON.stringify(data,null,2);
 try{
   if(navigator.share) await navigator.share({title:'Stödassistenten pilotfeedback',text});
   else if(navigator.clipboard){await navigator.clipboard.writeText(text);alert(tr('shared'))}
   else alert(text);
 }catch(e){}
}

function render(){
 document.getElementById('logo').textContent=tr('app');
 document.getElementById('pilot').textContent=tr('pilot');
 if(screen==='home') main().innerHTML=home();
 else if(screen.endsWith('R')) main().innerHTML=results();
 else main().innerHTML=flow()||home();
}
render();
</script>
</body>
</html>
