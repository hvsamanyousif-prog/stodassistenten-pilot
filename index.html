<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ea">
<title>Stödassistenten – Pilot</title>
<style>
:root{--bg:#f7f3ea;--paper:#fffdf8;--ink:#26322e;--muted:#6e7772;--line:#e8dfd0;--sage:#35675c;--soft:#e9f1ed;--warm:#fff2d7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:600px;margin:auto;padding:14px 14px 100px}.top{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 12px}.logo{font-weight:900}.pilot{font-size:11px;background:var(--warm);padding:6px 9px;border-radius:999px}.card{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:19px;margin:10px 0;box-shadow:0 8px 25px #40372a12}h1{font-size:34px;line-height:1.05;margin:4px 0 10px}h2{font-size:24px;margin:0 0 12px}p{line-height:1.5}.muted{color:var(--muted)}.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:15px 0}.lang,.choice,.demo,.btn,.fb{font:inherit;border:1px solid var(--line);background:white;color:var(--ink);border-radius:16px;padding:13px;cursor:pointer;font-weight:750}.lang.active{background:var(--soft);border-color:#a9c5bb}.primary{background:var(--sage);color:white;border:0;width:100%}.demo{width:100%;text-align:start;margin:6px 0}.demo small{display:block;color:var(--muted);margin-top:3px}.choice{display:block;width:100%;text-align:start;margin:8px 0}.back{border:0;background:none;color:var(--sage);font-weight:800;padding:6px 0;cursor:pointer}.notice{background:var(--warm);border-radius:15px;padding:11px;font-size:13px}.result{border:1px solid var(--line);background:white;border-radius:19px;padding:15px;margin:9px 0}.rhead{display:flex;justify-content:space-between;gap:8px}.tag{background:var(--soft);color:#28584c;border-radius:999px;padding:5px 7px;font-size:11px;font-weight:900}.result p{font-size:14px;color:var(--muted)}.info{background:#f4f6f0;border-radius:13px;padding:10px;font-size:13px;margin:7px 0}.feedback{border-top:1px solid var(--line);padding-top:9px;margin-top:9px}.fbs{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.fb{font-size:12px;padding:7px 9px}.fb.selected{background:var(--soft);border-color:#8fb5a8}.source{color:var(--sage);font-weight:800;text-decoration:none;font-size:13px}.share{margin-top:14px}.rtl{direction:rtl;text-align:right}.rtl .demo,.rtl .choice{text-align:right}.rtl .rhead{flex-direction:row-reverse}@media(max-width:420px){h1{font-size:30px}.langs{grid-template-columns:1fr}}
</style>
</head>
<body><div class="app"><div class="top"><div class="logo" id="logo"></div><div class="pilot" id="pilot"></div></div><main id="main"></main></div>
<script>
const T={
sv:{app:'🧭 Stödassistenten',pilot:'Privat pilot',hello:'Vad behöver du hjälp med?',sub:'Välj språk och testa en situation. Du behöver inte kunna namnet på något stöd.',choose:'Välj ett exempel',pension:'👴 Pensionär',pensionD:'Låg pension, hög hyra och tandvård',family:'🧩 Familj med autism/NPF',familyD:'Extra omvårdnad, tillsyn och kostnader',org:'⚽ Förening eller litet företag',orgD:'Bidrag, projektstöd och offentliga affärer',back:'Tillbaka',next:'Fortsätt',municipality:'Vilken kommun gäller det?',alone:'Bor personen ensam?',dental:'Finns kostnadsförslag från tandläkaren?',childAge:'Hur gammalt är barnet?',extra:'Vad tar mest extra tid i vardagen?',orgType:'Vad gäller det?',orgNeed:'Vad behöver ni hjälp med?',yes:'Ja',no:'Nej',unsure:'Vet inte',morning:'Morgon, hygien och påklädning',supervision:'Tillsyn och säkerhet',school:'Skola, kommunikation och övergångar',association:'Ideell förening / idrottsförening',company:'Litet företag',funding:'Bidrag eller finansiering',facility:'Lokal, anläggning eller utrustning',procurement:'Offentlig upphandling / anbud',results:'Det här är värt att kolla först',disclaimer:'Piloten avgör inte om du har rätt till stöd. Varje villkor måste verifieras mot aktuell originalkälla.',good:'Bra träff',check:'Värt att kolla',why:'Varför det kan passa',feedback:'Stämmer detta med din situation?',rel:'Relevant',known:'Kände redan till',notrel:'Inte relevant',source:'Officiell källa',share:'Skicka pilotfeedback',shared:'Feedback sammanställd. Välj hur du vill dela den.',home:'Börja om'},
ar:{app:'🧭 مساعد الدعم',pilot:'تجربة خاصة',hello:'بماذا تحتاج إلى مساعدة؟',sub:'اختر اللغة وجرّب حالة. لا تحتاج إلى معرفة اسم أي دعم.',choose:'اختر مثالاً',pension:'👴 متقاعد',pensionD:'معاش محدود، إيجار مرتفع وعلاج أسنان',family:'🧩 عائلة لديها طفل مع توحد/NPF',familyD:'رعاية ومراقبة وتكاليف إضافية',org:'⚽ جمعية أو شركة صغيرة',orgD:'منح ومشاريع وفرص عامة',back:'رجوع',next:'متابعة',municipality:'في أي بلدية؟',alone:'هل يعيش الشخص وحده؟',dental:'هل يوجد عرض تكلفة من طبيب الأسنان؟',childAge:'كم عمر الطفل؟',extra:'ما الذي يحتاج أكبر وقت إضافي يومياً؟',orgType:'ما نوع الجهة؟',orgNeed:'ما نوع المساعدة المطلوبة؟',yes:'نعم',no:'لا',unsure:'لا أعرف',morning:'الصباح والنظافة واللباس',supervision:'المراقبة والسلامة',school:'المدرسة والتواصل والانتقال',association:'جمعية / نادٍ رياضي',company:'شركة صغيرة',funding:'منح أو تمويل',facility:'مقر أو منشأة أو معدات',procurement:'مناقصة / عرض عام',results:'هذه أهم الأمور التي تستحق التحقق',disclaimer:'هذه النسخة لا تقرر الاستحقاق. يجب التحقق من كل شرط في المصدر الأصلي الحالي.',good:'تطابق جيد',check:'يستحق التحقق',why:'لماذا قد يناسبك',feedback:'هل يطابق هذا وضعك؟',rel:'مناسب',known:'كنت أعرفه',notrel:'غير مناسب',source:'المصدر الرسمي',share:'إرسال ملاحظات التجربة',shared:'تم إعداد الملاحظات. اختر طريقة المشاركة.',home:'ابدأ من جديد'},
fa:{app:'🧭 دستیار حمایت',pilot:'پایلوت خصوصی',hello:'به چه کمکی نیاز داری؟',sub:'زبان را انتخاب کن و یک موقعیت را امتحان کن. لازم نیست اسم حمایت را بدانی.',choose:'یک مثال انتخاب کن',pension:'👴 بازنشسته',pensionD:'مستمری کم، اجاره بالا و دندانپزشکی',family:'🧩 خانواده با کودک اوتیسم/NPF',familyD:'مراقبت، نظارت و هزینه‌های اضافه',org:'⚽ انجمن یا شرکت کوچک',orgD:'کمک‌هزینه، پروژه و فرصت‌های عمومی',back:'برگشت',next:'ادامه',municipality:'در کدام شهرداری؟',alone:'آیا فرد تنها زندگی می‌کند؟',dental:'آیا برآورد هزینه دندانپزشک وجود دارد؟',childAge:'سن کودک چقدر است؟',extra:'کدام بخش روزمره بیشترین زمان اضافه را می‌گیرد؟',orgType:'موضوع مربوط به چیست؟',orgNeed:'به چه کمکی نیاز دارید؟',yes:'بله',no:'نه',unsure:'نمی‌دانم',morning:'صبح، بهداشت و لباس',supervision:'نظارت و ایمنی',school:'مدرسه، ارتباط و تغییر فعالیت',association:'انجمن / باشگاه ورزشی',company:'شرکت کوچک',funding:'کمک‌هزینه یا تأمین مالی',facility:'محل، تأسیسات یا تجهیزات',procurement:'مناقصه / پیشنهاد عمومی',results:'این موارد ارزش بررسی دارند',disclaimer:'این نسخه تعیین نمی‌کند که حتماً واجد شرایط هستید. هر شرط باید در منبع اصلی و به‌روز بررسی شود.',good:'تطابق خوب',check:'ارزش بررسی دارد',why:'چرا ممکن است مناسب باشد',feedback:'آیا با وضعیت شما مطابقت دارد؟',rel:'مرتبط',known:'از قبل می‌دانستم',notrel:'نامرتبط',source:'منبع رسمی',share:'ارسال بازخورد پایلوت',shared:'بازخورد آماده شد. روش اشتراک‌گذاری را انتخاب کنید.',home:'از اول'}
};
const supports={
pension:[['Bostadstillägg','Pensionär + boendekostnad + begränsad ekonomi.','https://www.pensionsmyndigheten.se/for-pensionarer/ekonomiskt-stod/sa-fungerar-bostadstillagg/ansok-om-bostadstillagg'],['Förstärkt tandvårdsskydd 67+','Hög ålder och behov av tandvård.','https://www.forsakringskassan.se/privatperson/tandvard/tandvardsstod/ett-battre-skydd-mot-hoga-tandvardskostnader'],['Äldreförsörjningsstöd','Kan vara relevant vid mycket låg pension och svag ekonomi.','https://www.pensionsmyndigheten.se/for-pensionarer/ekonomiskt-stod/ansok-om-aldreforsorjningsstod'],['Lokala stiftelser','Kan komplettera offentliga stöd för till exempel tandvård eller andra behov.','https://stiftelser.lansstyrelsen.se/']],
family:[['Omvårdnadsbidrag','Extra omvårdnad och tillsyn jämfört med barn i samma ålder.','https://www.forsakringskassan.se/privatperson/familj-och-barn/barn-med-funktionsnedsattning-eller-behov-av-extra-stod/omvardnadsbidrag'],['Merkostnadsersättning för barn','Extra kostnader som beror på barnets funktionsnedsättning kan vara relevanta.','https://www.forsakringskassan.se/privatperson/familj-och-barn/barn-med-funktionsnedsattning-eller-behov-av-extra-stod/merkostnadsersattning-for-barn'],['Majblommans stöd','Kan passa barnfamiljer med pressad ekonomi och ett konkret behov.','https://majblomman.se/sok-stod/sok-har/'],['Kommunala/LSS-relaterade stödvägar','Kommunala insatser kan vara relevanta beroende på barnets individuella behov.','https://www.socialstyrelsen.se/kunskapsstod-och-regler/omraden/funktionshinder/lss/']],
org:[['LOK-stöd','För RF-anslutna idrottsföreningar med barn- och ungdomsverksamhet.','https://www.rf.se/bidrag-och-stod/lok-stod'],['RF:s anläggningsstöd','Kan passa projekt för idrottsmiljö och vissa tillgänglighetsåtgärder.','https://www.rf.se/bidrag-och-stod/stod-till-anlaggningar-och-idrottsmiljoer'],['Allmänna arvsfonden','Kan passa utvecklingsprojekt för fondens målgrupper.','https://www.arvsfonden.se/ansokan'],['Offentliga upphandlingar','Små företag kan matcha sin profil mot offentliga affärer.','https://www.upphandlingsmyndigheten.se/foretagare/']]
};
let lang='sv',screen='home',scenario=null,feedback={}; const tr=k=>T[lang][k]||k, main=()=>document.getElementById('main');
function setLang(l){lang=l;document.documentElement.lang=l;document.documentElement.dir=l==='sv'?'ltr':'rtl';document.body.classList.toggle('rtl',l!=='sv');render()}
function go(s){screen=s;render();scrollTo(0,0)}
function langs(){return `<div class="langs">${['sv','ar','fa'].map(l=>`<button class="lang ${l===lang?'active':''}" onclick="setLang('${l}')">${l==='sv'?'🇸🇪 Svenska':l==='ar'?'🇸🇦 العربية':'🇮🇷 فارسی'}</button>`).join('')}</div>`}
function home(){return `<section class="card"><h1>${tr('hello')}</h1><p class="muted">${tr('sub')}</p>${langs()}</section><section class="card"><h2>${tr('choose')}</h2>${[['pension','pension','pensionD'],['family','family','familyD'],['org','org','orgD']].map(x=>`<button class="demo" onclick="start('${x[0]}')"><b>${tr(x[1])}</b><small>${tr(x[2])}</small></button>`).join('')}</section>`}
function start(s){scenario=s;feedback={};go(s+'1')}
function back(prev='home'){return `<button class="back" onclick="go('${prev}')">${lang==='sv'?'←':'→'} ${tr('back')}</button>`}
function q(title,opts,prev){return `${back(prev)}<section class="card"><h2>${tr(title)}</h2>${opts.map(o=>`<button class="choice" onclick="go('${o[1]}')">${tr(o[0])}</button>`).join('')}</section>`}
function flow(){if(screen==='pension1')return q('municipality',[['next','pension2']],'home');if(screen==='pension2')return q('alone',[['yes','pension3'],['no','pension3'],['unsure','pension3']],'pension1');if(screen==='pension3')return q('dental',[['yes','pensionR'],['no','pensionR'],['unsure','pensionR']],'pension2');if(screen==='family1')return q('childAge',[['yes','family2'],['unsure','family2']],'home');if(screen==='family2')return q('extra',[['morning','familyR'],['supervision','familyR'],['school','familyR']],'family1');if(screen==='org1')return q('orgType',[['association','org2'],['company','org2']],'home');if(screen==='org2')return q('orgNeed',[['funding','orgR'],['facility','orgR'],['procurement','orgR']],'org1')}
function fb(id,val){feedback[id]=val;render()}
function results(){const rows=supports[scenario];return `${back()}<section class="card"><h1>${tr('results')}</h1><div class="notice">${tr('disclaimer')}</div></section>${rows.map((r,i)=>`<article class="result"><div class="rhead"><b>${r[0]}</b><span class="tag">${tr(i<2?'good':'check')}</span></div><p>${r[1]}</p><div class="info"><b>${tr('why')}</b><br>${r[1]}</div><a class="source" target="_blank" rel="noopener" href="${r[2]}">↗ ${tr('source')}</a><div class="feedback"><small>${tr('feedback')}</small><div class="fbs">${[['rel','rel'],['known','known'],['notrel','notrel']].map(v=>`<button class="fb ${feedback[r[0]]===v[1]?'selected':''}" onclick="fb('${r[0].replace(/'/g,'')}','${v[1]}')">${tr(v[0])}</button>`).join('')}</div></div></article>`).join('')}<button class="btn primary share" onclick="shareFeedback()">${tr('share')}</button>`}
async function shareFeedback(){const data={pilot:'v0.3',language:lang,scenario,ratings:feedback,timestamp:new Date().toISOString()};const text='Stödassistenten pilotfeedback\n'+JSON.stringify(data,null,2);try{if(navigator.share)await navigator.share({title:'Stödassistenten pilotfeedback',text});else{await navigator.clipboard.writeText(text);alert(tr('shared'))}}catch(e){}}
function render(){document.getElementById('logo').textContent=tr('app');document.getElementById('pilot').textContent=tr('pilot');if(screen==='home')main().innerHTML=home();else if(screen.endsWith('R'))main().innerHTML=results();else main().innerHTML=flow()||home()}
render();
</script></body></html>
