<!doctype html>
<html lang="sv" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ea">
<title>Stödassistenten – Snabbväg</title>
<style>
:root{--bg:#f7f3ea;--paper:#fffdf8;--ink:#18211e;--muted:#59635e;--line:#d8d0c4;--sage:#24594d;--soft:#e7f1ec;--warn:#fff2d7;--danger:#8d3e32}
*{box-sizing:border-box}html{font-size:18px}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}.skip{position:absolute;left:10px;top:-80px;background:#111;color:#fff;padding:12px;z-index:10}.skip:focus{top:10px}.app{max-width:680px;margin:auto;padding:14px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 2px}.logo{font-weight:900}.back{display:inline-block;margin:6px 0 12px;color:var(--sage);font-weight:800}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:20px;margin:10px 0}.hero{padding:24px 20px}h1{font-size:2rem;line-height:1.1;margin:5px 0 12px}h2{font-size:1.35rem;line-height:1.2;margin:0 0 12px}p{margin:.45rem 0}.muted{color:var(--muted)}.eyebrow{font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:.03em;color:var(--sage)}.langs,.choices,.feedback{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.lang,.choice,.fb{font:inherit;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:15px;padding:14px 16px;cursor:pointer;font-weight:800;min-height:52px}.choice{display:block;width:100%;text-align:start;margin:9px 0}.lang[aria-pressed="true"],.fb[aria-pressed="true"]{background:var(--soft);border-color:var(--sage)}a.source{display:inline-block;margin-top:10px;color:var(--sage);font-weight:900}.result{border-left:6px solid var(--sage)}.notice{background:var(--warn);padding:12px;border-radius:14px}.status{padding:12px;border-radius:14px;margin-top:10px}.status.ok{background:var(--soft)}.status.err{background:#fff0ea;color:var(--danger)}button:focus-visible,a:focus-visible,[tabindex="-1"]:focus{outline:4px solid #111;outline-offset:4px}.rtl{direction:rtl;text-align:right}.rtl .choice{text-align:right}@media(max-width:520px){html{font-size:17px}.langs{display:grid;grid-template-columns:1fr}.app{padding-left:10px;padding-right:10px}}
</style>
</head>
<body>
<a class="skip" href="#main">Hoppa till innehållet</a>
<div class="app">
<div class="top"><div class="logo" id="logo">🧭 Stödassistenten</div><span id="modeLabel"></span></div>
<a class="back" id="backLink" href="index.html">← Till startsidan</a>
<main id="main" tabindex="-1" aria-live="polite"></main>
</div>
<script>
const FEEDBACK_ENDPOINT='https://lldhnsixeyxdcxejdwmq.supabase.co/functions/v1/pilot-feedback';
const APP_VERSION='0.6.0';
const P=new URLSearchParams(location.search);
let lang=P.get('lang'); if(!['sv','ar','fa'].includes(lang))lang='sv';
let mode=P.get('mode'); if(!['dental','vision'].includes(mode))mode='vision';
let answer=null,finalFeedback={},submitState='idle';
const C={
sv:{back:'Till startsidan',dentalMode:'Tandvård – snabbväg',visionMode:'Synnedsättning – snabbväg',dentalTitle:'Finns ett konkret behov av tandvård?',dentalSub:'Ett steg först. Om svaret är ja går du direkt till vad som är värt att kontrollera.',visionTitle:'Vad behöver fungera bättre?',visionSub:'Vi håller det kort. Välj den konkreta vardagssituationen – ingen lång intervju.',yes:'Ja, jag behöver tandvård',no:'Nej / inte just nu',unsure:'Jag vet inte',home:'Bostaden fungerar inte bra',aid:'Synhjälpmedel eller teknik',both:'Båda / jag är osäker',results:'Det här är värt att kontrollera nu',dentalR:'Statligt tandvårdsstöd',dentalD:'Om du behöver tandvård kan statligt tandvårdsstöd, tandvårdsbidrag och högkostnadsskydd vara relevanta beroende på din situation och behandlingen. Be tandläkaren eller tandhygienisten kontrollera vilket stöd som kan användas och be om en prisuppgift innan behandlingen börjar.',dentalN:'Om behovet inte är konkret ännu kan du börja med informationen om statligt tandvårdsstöd och sedan ta ställning till undersökning eller behandling.',housingR:'Bostadsanpassningsbidrag',housingD:'Nedsatt syn kan vara en funktionsnedsättning som gör bostadsanpassning relevant. Kommunen prövar ansökan. Anpassningen ska vara nödvändig för att bostaden ska fungera och gäller normalt permanentbostaden.',aidR:'Synhjälpmedel och syncentral',aidD:'Synhjälpmedel kan provas ut utifrån behov. 1177 beskriver vägen via syncentral/förskrivare och vad du kan göra om hjälpmedlet inte fungerar för dig.',source:'Öppna officiell källa',disclaimer:'Stödassistenten avgör inte om du har rätt till stöd. Vi visar korta, verifierade vägar att kontrollera vidare.',again:'Ändra svar',feedbackTitle:'Var den här snabbvägen användbar?',clear:'Var nästa steg tydligt?',new:'Fick du reda på något nytt?',send:'Skicka anonym feedback',sent:'Tack! Feedbacken skickades.',error:'Feedbacken kunde inte skickas just nu.',missing:'Svara på alla tre frågorna först.',y:'Ja',n:'Nej'},
ar:{back:'العودة إلى الصفحة الرئيسية',dentalMode:'طب الأسنان – مسار سريع',visionMode:'ضعف البصر – مسار سريع',dentalTitle:'هل توجد حاجة فعلية لعلاج الأسنان؟',dentalSub:'خطوة واحدة أولاً. إذا كانت الإجابة نعم ننتقل مباشرة إلى ما يستحق التحقق.',visionTitle:'ما الذي يحتاج أن يعمل بشكل أفضل؟',visionSub:'نبقي المسار قصيراً. اختر الحاجة اليومية الفعلية دون مقابلة طويلة.',yes:'نعم، أحتاج إلى علاج أسنان',no:'لا / ليس الآن',unsure:'لا أعرف',home:'السكن لا يعمل جيداً بالنسبة لي',aid:'وسائل مساعدة بصرية أو تقنية',both:'كلاهما / لست متأكداً',results:'هذا ما يستحق التحقق الآن',dentalR:'دعم الأسنان الحكومي',dentalD:'إذا كنت تحتاج إلى علاج أسنان فقد تكون إعانات الأسنان والحماية من التكاليف المرتفعة ذات صلة بحسب حالتك والعلاج. اطلب من طبيب الأسنان التحقق مما يمكن تطبيقه واطلب تقديراً للسعر قبل بدء العلاج.',dentalN:'إذا لم تكن الحاجة محددة بعد، ابدأ بمعلومات دعم الأسنان الحكومي ثم قرر الخطوة التالية.',housingR:'دعم تكييف السكن',housingD:'قد يجعل ضعف البصر تكييف السكن ذا صلة. البلدية تفحص الطلب ويجب أن يكون التعديل ضرورياً لعمل السكن، وعادةً يتعلق بالسكن الدائم.',aidR:'وسائل المساعدة البصرية ومركز البصر',aidD:'يمكن وصف وسائل مساعدة بصرية حسب الحاجة. يشرح 1177 الطريق عبر مركز البصر أو الجهة الواصفة وما يمكن فعله إذا لم تعمل الوسيلة لك.',source:'فتح المصدر الرسمي',disclaimer:'لا يقرر مساعد الدعم الاستحقاق. نعرض مسارات قصيرة وموثوقة للتحقق منها.',again:'تغيير الإجابة',feedbackTitle:'هل كان هذا المسار السريع مفيداً؟',clear:'هل كانت الخطوة التالية واضحة؟',new:'هل عرفت شيئاً جديداً؟',send:'إرسال ملاحظات مجهولة',sent:'شكراً! تم إرسال الملاحظات.',error:'تعذر إرسال الملاحظات الآن.',missing:'أجب عن الأسئلة الثلاثة أولاً.',y:'نعم',n:'لا'},
fa:{back:'بازگشت به صفحه اصلی',dentalMode:'دندانپزشکی – مسیر سریع',visionMode:'اختلال بینایی – مسیر سریع',dentalTitle:'آیا نیاز مشخص به دندانپزشکی وجود دارد؟',dentalSub:'اول فقط یک مرحله. اگر پاسخ بله باشد مستقیم به مواردی می‌رویم که باید بررسی شوند.',visionTitle:'چه چیزی باید بهتر کار کند؟',visionSub:'مسیر را کوتاه نگه می‌داریم. نیاز واقعی روزمره را انتخاب کن؛ بدون مصاحبه طولانی.',yes:'بله، به دندانپزشکی نیاز دارم',no:'نه / فعلاً نه',unsure:'نمی‌دانم',home:'خانه برای من مناسب نیست',aid:'وسیله کمک‌بینایی یا فناوری',both:'هر دو / مطمئن نیستم',results:'این موارد اکنون ارزش بررسی دارند',dentalR:'حمایت دولتی دندانپزشکی',dentalD:'اگر به درمان دندان نیاز دارید، حمایت‌های دولتی و پوشش هزینه‌های بالا ممکن است با توجه به شرایط و نوع درمان مرتبط باشند. از دندانپزشک بخواهید بررسی کند کدام حمایت قابل استفاده است و پیش از درمان برآورد قیمت بدهد.',dentalN:'اگر هنوز نیاز مشخص نیست، ابتدا اطلاعات حمایت دولتی دندانپزشکی را ببینید و سپس درباره معاینه یا درمان تصمیم بگیرید.',housingR:'کمک‌هزینه مناسب‌سازی مسکن',housingD:'اختلال بینایی می‌تواند مناسب‌سازی مسکن را مرتبط کند. شهرداری درخواست را بررسی می‌کند و تغییر باید برای قابل استفاده بودن خانه ضروری باشد و معمولاً مربوط به محل سکونت دائمی است.',aidR:'وسایل کمک‌بینایی و مرکز بینایی',aidD:'وسایل کمک‌بینایی بر اساس نیاز می‌توانند تجویز شوند. 1177 مسیر مرکز بینایی یا تجویزکننده و کارهایی را که در صورت نامناسب بودن وسیله می‌توان انجام داد توضیح می‌دهد.',source:'باز کردن منبع رسمی',disclaimer:'دستیار حمایت درباره استحقاق تصمیم نمی‌گیرد. مسیرهای کوتاه و تأییدشده برای بررسی بیشتر نشان می‌دهیم.',again:'تغییر پاسخ',feedbackTitle:'آیا این مسیر سریع مفید بود؟',clear:'آیا قدم بعدی روشن بود؟',new:'آیا چیز جدیدی یاد گرفتی؟',send:'ارسال بازخورد ناشناس',sent:'ممنون! بازخورد ارسال شد.',error:'فعلاً ارسال بازخورد ممکن نیست.',missing:'ابتدا به هر سه سؤال پاسخ بده.',y:'بله',n:'نه'}
};
const tr=k=>(C[lang]&&C[lang][k])||C.sv[k]||k;
const main=()=>document.getElementById('main');
function applyLang(){const rtl=lang==='ar'||lang==='fa';document.documentElement.lang=lang;document.documentElement.dir=rtl?'rtl':'ltr';document.body.classList.toggle('rtl',rtl);document.getElementById('backLink').textContent=(rtl?'→ ':'← ')+tr('back');document.getElementById('backLink').href='index.html?lang='+lang;document.getElementById('modeLabel').textContent=tr(mode==='dental'?'dentalMode':'visionMode')}
function focusMain(){requestAnimationFrame(()=>{main().focus({preventScroll:false})})}
function setLang(next){lang=next;const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u);render()}
function languageButtons(){return `<div class="langs" aria-label="Language">${[['sv','Svenska'],['ar','العربية'],['fa','فارسی']].map(x=>`<button type="button" class="lang" aria-pressed="${lang===x[0]?'true':'false'}" data-lang="${x[0]}">${x[1]}</button>`).join('')}</div>`}
function question(){if(mode==='dental')return `<section class="card hero"><div class="eyebrow">${tr('dentalMode')}</div><h1>${tr('dentalTitle')}</h1><p class="muted">${tr('dentalSub')}</p>${languageButtons()}</section><section class="card choices" aria-label="${tr('dentalTitle')}"><button class="choice" data-answer="yes">${tr('yes')}</button><button class="choice" data-answer="no">${tr('no')}</button><button class="choice" data-answer="unsure">${tr('unsure')}</button></section>`;return `<section class="card hero"><div class="eyebrow">${tr('visionMode')}</div><h1>${tr('visionTitle')}</h1><p class="muted">${tr('visionSub')}</p>${languageButtons()}</section><section class="card choices" aria-label="${tr('visionTitle')}"><button class="choice" data-answer="home">${tr('home')}</button><button class="choice" data-answer="aid">${tr('aid')}</button><button class="choice" data-answer="both">${tr('both')}</button></section>`}
function resultCard(title,body,url){return `<section class="card result"><h2>${title}</h2><p>${body}</p><a class="source" target="_blank" rel="noopener" href="${url}">↗ ${tr('source')}</a></section>`}
function feedbackQuestion(key,label){return `<div><p><b>${label}</b></p><div class="feedback"><button class="fb" aria-pressed="${finalFeedback[key]===true?'true':'false'}" data-feedback="${key}:true">${tr('y')}</button><button class="fb" aria-pressed="${finalFeedback[key]===false?'true':'false'}" data-feedback="${key}:false">${tr('n')}</button></div></div>`}
function results(){let cards='';if(mode==='dental'){cards=resultCard(tr('dentalR'),answer==='yes'?tr('dentalD'):tr('dentalN'),'https://www.forsakringskassan.se/privatperson/tandvard/tandvardsstod')}else{if(answer==='home'||answer==='both')cards+=resultCard(tr('housingR'),tr('housingD'),'https://www.boverket.se/sv/babhandboken/for-dig-som-soker/vad-ar-bostadsanpassningsbidrag/');if(answer==='aid'||answer==='both')cards+=resultCard(tr('aidR'),tr('aidD'),'https://www.1177.se/undersokning-behandling/hjalpmedel/syn/synhjalpmedel/')}return `<section class="card hero"><h1>${tr('results')}</h1><div class="notice">${tr('disclaimer')}</div><button class="choice" id="changeAnswer">${tr('again')}</button></section>${cards}<section class="card"><h2>${tr('feedbackTitle')}</h2>${feedbackQuestion('useful',tr('feedbackTitle'))}${feedbackQuestion('clear',tr('clear'))}${feedbackQuestion('new',tr('new'))}<button class="choice" id="sendFeedback">${tr('send')}</button><div id="status" aria-live="assertive"></div></section>`}
function bind(){document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{answer=b.dataset.answer;render();focusMain()}));document.querySelectorAll('[data-feedback]').forEach(b=>b.addEventListener('click',()=>{const [k,v]=b.dataset.feedback.split(':');finalFeedback[k]=v==='true';render()}));const change=document.getElementById('changeAnswer');if(change)change.addEventListener('click',()=>{answer=null;render();focusMain()});const send=document.getElementById('sendFeedback');if(send)send.addEventListener('click',submitFeedback)}
async function submitFeedback(){const status=document.getElementById('status');if(!['useful','clear','new'].every(k=>typeof finalFeedback[k]==='boolean')){status.className='status err';status.textContent=tr('missing');return}const payload={app_version:APP_VERSION,language:lang,flow:mode==='dental'?'dental_fastpath':'vision_fastpath',learned_new:finalFeedback.new,useful:finalFeedback.useful,next_step_clear:finalFeedback.clear,ratings:{}};try{const r=await fetch(FEEDBACK_ENDPOINT,{method:'POST',mode:'cors',credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw new Error('HTTP '+r.status);status.className='status ok';status.textContent=tr('sent')}catch(e){status.className='status err';status.textContent=tr('error')}}
function render(){applyLang();main().innerHTML=answer===null?question():results();bind()}
render();
</script>
</body>
</html>
