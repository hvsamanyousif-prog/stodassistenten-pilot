const DATA={
sv:{back:'Startsidan',context:'Din beskrivning',step:'Välj det som bäst beskriver vad du vill lösa nu',suggest:'Föreslaget',resultTitle:'Börja här',change:'Ändra val',source:'Officiell källa',next:'Nästa steg',notice:'Stödassistenten avgör inte om du har rätt till stöd eller vilken behandling som behövs. Vi visar verifierade vägar och vad du kan kontrollera härnäst.',helpful:'Det här hjälpte',notHelpful:'Det här hjälpte inte',dental:{eyebrow:'Tandvård · guidad väg',title:'Vi börjar med vad du behöver få löst.',sub:'Inte med namnet på ett stöd. Välj behovet som ligger närmast så visar vi de mest relevanta vägarna.',question:'Vad är viktigast för dig just nu?',questionSub:'Du kan byta när som helst. Vi frågar bara sådant som förändrar nästa steg.',options:{cost:['Jag är orolig för kostnaden','Jag behöver förstå tandvårdsstöd, högkostnadsskydd eller vad jag kan göra om ekonomin inte räcker.'],care:['Jag har besvär och behöver tandvård','Jag vill veta hur jag går vidare för att få mina tänder bedömda eller behandlade.'],support:['Jag vill förstå vilka tandvårdsstöd som kan gälla','Jag vill börja med de statliga stöden och vad tandläkaren ska kunna kontrollera.'],unsure:['Jag vet inte var jag ska börja','Visa en kort väg som täcker både vård och kostnad.']},results:{cost:[['Börja med statligt tandvårdsstöd','Försäkringskassan beskriver allmänt och särskilt tandvårdsbidrag samt högkostnadsskydd. Vilket stöd som kan användas beror bland annat på din situation och behandlingen.','Be tandläkaren eller tandhygienisten kontrollera vilket statligt stöd som kan användas och be om en prisuppgift innan behandlingen börjar.','https://www.forsakringskassan.se/privatperson/tandvard/tandvardsstod'],['Om pengarna inte räcker','1177 beskriver vilka vägar som kan finnas när man inte har råd med tandvård, inklusive kontakt med socialtjänsten när andra betalningsmöjligheter saknas.','Om ekonomin stoppar nödvändig tandvård: läs den här vägen innan du avstår och kontrollera vad som gäller i å att fungera bättre?',questionSub:'Behovet styr vägen. Du kan välja flera områden genom att komma tillbaka hit.',options:{home:['Hemma i bostaden','Till exempel orientering, belysning, nivåskillnader eller annat som gör bostaden svår att använda.'],tech:['Läsa, mobil, dator eller annan teknik','Jag behöver hjälpmedel, inställningar eller träning för att klara vardagen bättre.'],work:['Arbete eller studier','Synen gör det svårare att delta i arbete eller undervisning och jag behöver veta vilken hjälpväg som finns.'],unsure:['Jag vill veta vilken hjälp som finns överlag','Jag är inte säker på rätt kategori och vill börja brett utan många frågor.']},results:{home:[['Bostadsanpassningsbidrag','Boverkets handbok beskriver det kommunala bostadsanpassningsbidraget och villkoren för att en bostad ska kunna anpassas på grund av funktionsnedsättning.','Kontakta kommunen om bostadsanpassning och beskriv den konkreta aktivitet eller del av bostaden som inte fungerar.','https://www.boverket.se/sv/babhandboken/bostadsanpassningsbidrag/'],['Syncentral och vardagsstrategier','1177 beskriver att syncentralen kan hjälpa med hjälpmedel, träning och strategier utifrån vad som är svårt i vardagen.','Skriv ned 2–3 aktiviteter hemma som är svåra på grund av synen och ta med dem i kontakt med syncentral/förskrivare.','https://www.1177.se/undersokning-behandling/hjalpmedel/syn/synhjalpmedel/']],tech:[['Synhjälpmedel och syncentral','1177 beskriver vägen till synhjälpmedel och att syncentralen kan ge stöd kring bland annat mobil, surfplatta, dator och andra vardagsaktiviteter.','Börja med den aktivitet som är svårast – läsa post, använda mobil/dator eller orientera dig – och be om behovsbedömning.','https://www.1177.se/undersokning-behandling/hjalpmedel/syn/synhjalpmedel/']],work:[['Hjälpmedel för arbete eller skola','1177 anger att skolan är en väg för särskilda hjälpmedel i undervisningen och att Försäkringskassan eller Arbetsförmedlingen kan vara relevanta för särskilda arbetshjälpmedel.','Välj först om hindret främst finns i arbete eller utbildning och dokumentera vilken arbets-/studieaktivitet synen gör svår.','https://www.1177.se/undersokning-behandling/hjalpmedel/syn/synhjalpmedel/'],['Syncentralens behovsbedömning','Syncentralen bedömer behov tillsammans med dig och kan ge hjälpmedel, strategier och träning.','Ta med konkreta exempel från arbete eller studier till behovsbedömningen.','https://www.1177.se/undersokning-behandling/hjalpmedel/syn/synhjalpmedel/']],unsure:[['Börja hos synhjälpmedelsvägen','1177 beskriver hur syncentral och förskrivare utreder vad du har svårt att göra och vilken hjälp som kan passa.','Börja med att formulera tre saker i vardagen som synen gör svåra. Det räcker som första underlag.','https://www.1177.se/undersokning-behandling/hjalpmedel/syn/synhjalpmedel/'],['Om bostaden är en del av problemet','Bostadsanpassningsbidrag är en separat kommunal väg när en funktionsnedsättning gör att bostaden behöver anpassas.','Lägg till vilken del av bostaden som inte fungerar och kontrollera kommunens ansökningsväg.','https://www.boverket.se/sv/babhandboken/bostadsanpassningsbidrag/']]}}},
ar:{back:'الصفحة الرئيسية',context:'وصفك',step:'اختر ما يصف ما تريد حله الآن',suggest:'مقترح',resultTitle:'ابدأ هنا',change:'تغيير الاختيار',source:'المصدر الرسمي',next:'الخطوة التالية',notice:'لا يقرر مساعد الدعم الاستحقاق أو العلاج. نعرض مسارات موثوقة وما الذي يمكنك التحقق منه تالياً.',helpful:'هذا مفيد',notHelpful:'غير مفيد',dental:{eyebrow:'طب الأسنان · مسار موجه',title:'نبدأ بما تحتاج إلى حله.',sub:'ليس باسم الدعم. اختر الحاجة الأقرب.',question:'ما الأهم الآن؟',questionSub:'يمكنك التغيير في أي وقت.',options:{cost:['أنا قلق من التكلفة','أريد فهم الدعم والتكاليف.'],care:['لدي مشكلة وأحتاج إلى علاج','أريد معرفة كيف أحصل على تقييم أو علاج.'],support:['أريد فهم دعم الأسنان','أريد البدء بالدعم الحكومي.'],unsure:['لا أعرف من أين أبدأ','اعرض مساراً قصيراً للرعاية والتكلفة.']}},vision:{eyebrow:'ضعف البصر · مسار موجه',title:'نبدأ بما يمنعك ضعف البصر من فعله.',sub:'دون مقابلة طويلة. اختر أين تظهر المشكلة أكثر.',question:'ما الذي تريد أن يعمل بشكل أفضل؟',questionSub:'الحاجة تحدد المسار.',options:{home:['في المنزل','السكن أو الحركة أو الإضاءة أو استخدام المنزل.'],tech:['القراءة أو الهاتف أو الكمبيوتر','أحتاج أدوات أو تدريباً.'],work:['العمل أو الدراسة','أحتاج مساراً للمساعدة في العمل أو التعليم.'],unsure:['أريد معرفة المساعدة المتاحة','ابدأ بشكل واسع.']}}},
fa:{back:'صفحه اصلی',context:'توضیح تو',step:'آنچه را می‌خواهی همین حالا حل کنی انتخاب کن',suggest:'پیشنهاد',resultTitle:'از اینجا شروع کن',change:'تغییر انتخاب',source:'منبع رسمی',next:'قدم بعدی',notice:'دستیار حمایت درباره استحقاق یا درمان تصمیم نمی‌گیرد. مسیرهای تأییدشده و قدم بعدی را نشان می‌دهد.',helpful:'مفید بود',notHelpful:'مفید نبود',dental:{eyebrow:'دندانپزشکی · مسیر هدایت‌شده',title:'از چیزی شروع می‌کنیم که باید حل شود.',sub:'نه از نام یک حمایت. نزدیک‌ترین نیاز را انتخاب کن.',question:'الان چه چیزی مهم‌تر است؟',questionSub:'هر زمان می‌توانی انتخاب را عوض کنی.',options:{cost:['نگران هزینه هستم','می‌خواهم حمایت و هزینه را بفهمم.'],care:['مشکل دارم و به دندانپزشکی نیاز دارم','می‌خواهم بدانم چگونه ارزیابی یا درمان بگیرم.'],support:['می‌خواهم حمایت‌های دندانپزشکی را بفهمم','از حمایت دولتی شروع می‌کنم.'],unsure:['نمی‌دانم از کجا شروع کنم','یک مسیر کوتاه برای درمان و هزینه نشان بده.']}},vision:{eyebrow:'اختلال بینایی · مسیر هدایت‌شده',title:'از کاری شروع می‌کنیم که بینایی مانع آن شده.',sub:'بدون مصاحبه طولانی. محل اصلی مشکل را انتخاب کن.',question:'چه چیزی باید بهتر کار کند؟',questionSub:'نیاز مسیر را مشخص می‌کند.',options:{home:['در خانه','خانه، حرکت، نور یا استفاده از فضا.'],tech:['خواندن، موبایل یا رایانه','به ابزار یا آموزش نیاز دارم.'],work:['کار یا تحصیل','به مسیر کمک برای کار یا آموزش نیاز دارم.'],unsure:['می‌خواهم بدانم چه کمک‌هایی وجود دارد','گسترده شروع کن.']}}}}
};
const SV_RESULTS=DATA.sv;
function d(){return DATA[lang]||DATA.sv}function m(){return d()[mode]||d().vision}
function infer(){if(!q)return 'unsure';const x=q.toLowerCase();if(mode==='dental'){if(/kost|råd|peng|dyr|stöd|bidrag|اقتص|مال|هزینه|پول/.test(x))return 'cost';if(/ont|värk|smärt|akut|svull|besvär|درد|وجع/.test(x))return 'care';if(/stöd|bidrag|högkost|حمایت|دعم/.test(x))return 'support';return 'unsure'}if(/hem|bostad|lägen|trösk|kök|belys|خانه|منزل/.test(x))return 'home';if(/mobil|dator|läsa|skärm|voiceover|hjälpmedel|تلفن|رایانه|خواندن/.test(x))return 'tech';if(/jobb|arbete|skola|stud|کار|تحصیل|عمل|دراسة/.test(x))return 'work';return 'unsure'}
function localizedResults(key){const local=m().results&&m().results[key];if(local)return local;return SV_RESULTS[mode].results[key]||SV_RESULTS[mode].results.unsure}
function sourceCard(row,i){return `<article class="card ${i===0?'top':''}"><div class="label">${i===0?d().resultTitle:d().next}</div><h3>${row[0]}</h3><p>${row[1]}</p><div class="next"><b>${d().next}:</b> ${row[2]}</div><a class="source" href="${row[3]}" target="_blank" rel="noopener">${d().source} <span aria-hidden="true">↗</span></a></article>`}
function showResults(key){selected=key;document.querySelectorAll('.choice').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.key===key)));const rows=localizedResults(key);const box=document.getElementById('results');box.innerHTML=`<div class="resulthead"><div><div class="step"><span>2</span><span>${d().resultTitle}</span></div><h2>${(m().options[key]||m().options.unsure)[0]}</h2></div><button class="change" type="button" onclick="changeChoice()">${d().change}</button></div><div class="cards">${rows.map(sourceCard).join('')}</div><div class="notice">${d().notice}</div><div class="footeractions"><button class="feedback" type="button" onclick="feedback(this,true)">${d().helpful}</button><button class="feedback" type="button" onclick="feedback(this,false)">${d().notHelpful}</button></div>`;box.hidden=false;box.setAttribute('tabindex','-1');box.focus();history.replaceState(null,'',(()=>{const u=new URL(location.href);u.searchParams.set('need',key);return u})());}
function feedback(btn,val){document.querySelectorAll('.feedback').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');}
function changeChoice(){document.getElementById('results').hidden=true;document.getElementById('question').focus?.();window.scrollTo({top:160,behavior:'smooth'})}
function render(){const rtl=lang==='ar'||lang==='fa';document.documentElement.lang=lang;document.documentElement.dir=rtl?'rtl':'ltr';document.body.classList.toggle('rtl',rtl);document.getElementById('back').textContent=(rtl?'→ ':'← ')+d().back;document.getElementById('back').href='index.html?lang='+lang;document.getElementById('eyebrow').textContent=m().eyebrow;document.getElementById('title').textContent=m().title;document.getElementById('subtitle').textContent=m().sub;document.getElementById('stepText').textContent=d().step;document.getElementById('question').textContent=m().question;document.getElementById('question').setAttribute('tabindex','-1');document.getElementById('questionSub').textContent=m().questionSub;if(q){document.getElementById('context').hidden=false;document.getElementById('contextLabel').textContent=d().context;document.getElementById('contextText').textContent=q}else document.getElementById('context').hidden=true;const suggestion=infer();const order=[suggestion,...Object.keys(m().options).filter(k=>k!==suggestion)];document.getElementById('choices').innerHTML=order.map(k=>{const o=m().options[k];return `<button class="choice ${k===suggestion?'suggested':''}" data-key="${k}" type="button" aria-pressed="false">${k===suggestion?`<span class="suggest">${d().suggest}</span>`:''}<b>${o[0]}</b><small>${o[1]}</small></button>`}).join('');document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>showResults(b.dataset.key)));const need=P.get('need');if(need&&m().options[need])showResults(need)}
render();
</script>
