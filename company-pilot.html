<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ea">
<title>Stödassistenten – Företagspilot</title>
<style>
:root{--bg:#f7f3ea;--paper:#fffdf8;--ink:#26322e;--muted:#6e7772;--line:#e8dfd0;--sage:#35675c;--soft:#e9f1ed;--warm:#fff2d7;--rose:#fff0ea;--danger:#8d3e32}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:680px;margin:auto;padding:14px 14px 100px}.top{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 12px}.logo{font-weight:900}.pilot{font-size:11px;background:var(--warm);padding:6px 9px;border-radius:999px}.card{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:19px;margin:10px 0;box-shadow:0 8px 25px #40372a12}.hero{padding:23px 19px}h1{font-size:34px;line-height:1.06;margin:4px 0 10px}h2{font-size:24px;margin:0 0 12px}h3{margin:0 0 8px}p{line-height:1.5}.muted{color:var(--muted)}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--sage)}.choice,.btn{font:inherit;border:1px solid var(--line);background:white;color:var(--ink);border-radius:16px;padding:13px;cursor:pointer;font-weight:750}.choice{display:block;width:100%;text-align:start;margin:8px 0}.choice.active{background:var(--soft);border-color:#8fb5a8}.primary{background:var(--sage);color:white;border:0;width:100%;margin-top:10px}.primary:disabled{opacity:.5;cursor:not-allowed}.back{border:0;background:none;color:var(--sage);font-weight:800;padding:6px 0;cursor:pointer}.notice{background:var(--warm);border-radius:15px;padding:12px;font-size:13px}.privacy{background:var(--soft);border-radius:15px;padding:12px;font-size:13px}.progress{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:7px}.field{width:100%;font:inherit;border:1px solid var(--line);background:white;border-radius:16px;padding:13px;margin:8px 0;min-height:96px;resize:vertical}.result{border:1px solid var(--line);background:white;border-radius:19px;padding:15px;margin:9px 0}.tag{display:inline-block;background:var(--soft);color:#28584c;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900}.warn{background:var(--rose);border-radius:15px;padding:12px;font-size:13px}.checklist{padding-left:20px}.checklist li{margin:9px 0}.source{display:block;color:var(--sage);font-weight:800;text-decoration:none;margin:9px 0}.localnote{font-size:12px;color:var(--muted)}@media(max-width:420px){h1{font-size:30px}.app{padding-left:11px;padding-right:11px}}
.platform-home{display:inline-block;color:var(--sage);font-weight:800;text-decoration:none;margin:2px 0 8px}.score{background:var(--soft);border-radius:15px;padding:12px;margin:10px 0}.actionbox{background:#f4f6f0;border-radius:15px;padding:12px;margin:10px 0}.feedback-panel{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}.fbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.fb{font:inherit;border:1px solid var(--line);background:white;border-radius:14px;padding:9px 11px;cursor:pointer;font-weight:750;font-size:13px}.fb.selected{background:var(--soft);border-color:#8fb5a8}.finalq{margin:12px 0;padding:12px;background:#f8f5ef;border-radius:15px}.status{margin-top:10px;padding:11px;border-radius:14px;font-size:13px;font-weight:700}.status.ok{background:var(--soft)}.status.err{background:var(--rose);color:var(--danger)}
</style>
</head>
<body>
<div class="app">
  <a class="platform-home" href="index.html">← Alla ingångar i Stödassistenten</a>
  <div class="top"><div class="logo">🧭 Stödassistenten</div><div class="pilot">Företagspilot v0.1</div></div>
  <main id="main"></main>
</div>
<script>
const APP_VERSION='0.6.1';
const FEEDBACK_ENDPOINT='https://lldhnsixeyxdcxejdwmq.supabase.co/functions/v1/pilot-feedback';
const feedback={new:null,useful:null,clear:null,status:'idle',ratings:{}};
function resetFeedback(){Object.assign(feedback,{new:null,useful:null,clear:null,status:'idle',ratings:{}})}
const STEP={START:0,GOAL:1,SECTOR:2,GEOGRAPHY:3,CAPACITY:4,REFERENCES:5,DOCS:6,RESULT:7};
const state={step:STEP.START,goal:null,sector:null,geography:null,capacity:null,references:null,docs:null};
const main=document.getElementById('main');
const steps=['start','goal','sector','geography','capacity','references','docs','result'];
function reset(){Object.assign(state,{step:STEP.START,goal:null,sector:null,geography:null,capacity:null,references:null,docs:null});resetFeedback();render()}
function go(i){state.step=Math.max(STEP.START,Math.min(i,STEP.RESULT));window.scrollTo({top:0,behavior:'smooth'});render()}
function nextStepAfter(key){if(key==='sector'&&state.goal==='funding')return STEP.RESULT;if(key==='docs')return STEP.RESULT;return Math.min(state.step+1,STEP.RESULT)}
function pick(key,val){state[key]=val;go(nextStepAfter(key))}
function btn(label,key,val){return `<button class="choice ${state[key]===val?'active':''}" onclick="pick('${key}','${val}')">${label}</button>`}
function backTarget(){if(state.step===STEP.RESULT)return state.goal==='funding'?STEP.SECTOR:STEP.DOCS;return Math.max(STEP.START,state.step-1)}
function back(){return state.step>STEP.START?`<button class="back" onclick="go(${backTarget()})">← Tillbaka</button>`:''}
function progressText(){if(state.step===STEP.START||state.step===STEP.RESULT)return '';const total=state.goal==='funding'?2:6;const current=Math.min(state.step,total);return `Steg ${current} av ${total}`}
function wrap(title,body){const progress=progressText();return `${back()}<section class="card">${progress?`<div class="progress">${progress}</div>`:''}<h2>${title}</h2>${body}</section>`}
function start(){return `<section class="card hero"><div class="eyebrow">Företag / offentlig marknad</div><h1>Från “det är ett hav” till en tydlig nästa plan.</h1><p class="muted">Den här tidiga företagspiloten hjälper dig strukturera vad du söker och vad som behöver vara på plats innan du går vidare. Den avgör inte om du vinner en upphandling eller får finansiering.</p><div class="privacy">🔒 Dina svar stannar i webbläsaren. Om du själv skickar feedback skickas bara anonym produktfeedback: version, flöde och dina bedömningar.</div><button class="btn primary" onclick="go(1)">Starta företagstestet</button></section><section class="card"><h3>Viktigt</h3><div class="notice">Vi visar bara verkliga, verifierbara ingångar och officiella källor. Vi hittar inte på bidrag, finansiering eller upphandlingskrav. Ett specifikt upphandlingsdokument styr alltid över generella råd.</div></section>`}
function goal(){return wrap('Vad vill företaget främst göra?',btn('Hitta offentliga upphandlingar / lämna anbud','goal','procurement')+btn('Hitta finansiering eller företagsstöd','goal','funding')+btn('Båda','goal','both'))}
function sector(){return wrap('Vilken typ av verksamhet driver ni?',btn('Städ / lokalvård','sector','cleaning')+btn('Bygg / fastighet / entreprenad','sector','construction')+btn('Konsult / tjänster','sector','consulting')+btn('Annat','sector','other'))}
function geography(){return wrap('Var vill ni kunna ta uppdrag eller stöd?',btn('Främst lokalt / i min region','geography','local')+btn('Flera regioner','geography','multi')+btn('Hela Sverige','geography','national')+btn('Osäker','geography','unknown'))}
function capacity(){return wrap('Har ni koll på vilken kapacitet ni faktiskt kan lova?',btn('Ja – vi vet ungefär volym, bemanning och område','capacity','yes')+btn('Delvis','capacity','partial')+btn('Nej / behöver hjälp att räkna på det','capacity','no'))}
function references(){return wrap('Kan ni visa relevanta referenser eller tidigare uppdrag?',btn('Ja','references','yes')+btn('Några, men inte så strukturerat','references','partial')+btn('Nej / osäker','references','no'))}
function docs(){return wrap('Har ni samlat vanliga företagsunderlag på ett ställe?',`<p class="muted">Exempelvis registrerings-/skatteuppgifter, försäkringsunderlag, kvalitetsrutiner, referenser och andra bevis som kan efterfrågas. Vilka dokument som faktiskt krävs bestäms av den specifika upphandlingen eller stödutlysningen.</p>`+btn('Ja','docs','yes')+btn('Delvis','docs','partial')+btn('Nej / osäker','docs','no'))}
function readiness(){let gaps=[];if(state.capacity!=='yes')gaps.push('göra kapacitet och geografiskt åtagande tydligare');if(state.references!=='yes')gaps.push('strukturera relevanta referenser och tidigare leveranser');if(state.docs!=='yes')gaps.push('samla vanliga företagsunderlag och bevis på ett ställe');return gaps}
function procurementBlock(){const gaps=readiness();return `<article class="result"><span class="tag">Offentlig upphandling</span><h3>Första readiness-bedömningen</h3>${gaps.length?`<p>Innan ni lägger mycket tid på anbud är det klokt att först ${gaps.join(', ')}.</p>`:`<p>Ni verkar ha en grund att utgå från. Nästa steg är att välja en konkret offentlig affärsväg och kontrollera den mot den styrande källan.</p>`}<ul class="checklist"><li><b>Annonserade upphandlingar:</b> bevaka registrerade annonsdatabaser och relevanta CPV-koder. En enda databas är inte säkert heltäckande.</li><li><b>Direktupphandling:</b> Direktupphandlingar behöver inte annonseras. Kartlägg därför relevanta offentliga köpare och hur de gör mindre eller andra tillåtna direktinköp. Att registrera eller presentera företaget garanterar inte att ni får en förfrågan.</li><li><b>Dynamiskt inköpssystem (DIS):</b> anta inte att det är för sent bara för att systemet redan har startat. Kontrollera de aktuella systemdokumenten och kvalificeringskraven; DIS kan vara öppet för nya leverantörer under giltighetstiden.</li><li>När ni har en konkret annons eller inbjudan: läs hela upphandlingsdokumentet och separera obligatoriska krav från sådant som utvärderas.</li><li>Skapa en checklista: krav → vilket bevis krävs → vem ansvarar → deadline.</li><li><b>Oklart krav före sista anbudsdag:</b> använd den officiella funktionen för Frågor och svar i upphandlingsverktyget som anges i underlaget, så tidigt som möjligt. Följ publicerade frågor, svar och rättelser/tillägg eftersom de kan ändra hur kravet ska förstås.</li><li>Om ett obligatoriskt krav efter officiell förtydligande fortfarande inte kan uppfyllas eller styrkas vid inlämning: markera det som en no-bid-lucka i stället för att överdriva.</li><li><b>Efter inlämning:</b> förutsätt inte att en missad obligatorisk uppgift kan kompletteras efter sista anbudsdag. Rättelse, förtydligande och komplettering är villkorat och bedöms av den upphandlande organisationen enligt reglerna; bygg därför inte anbudet på att en brist kan lagas i efterhand.</li></ul><a class="source" target="_blank" rel="noopener" href="https://www.upphandlingsmyndigheten.se/gora-affarer-med-offentlig-sektor/hitta-affaren-i-offentlig-sektor">↗ Upphandlingsmyndigheten – Hitta affären i offentlig sektor</a><a class="source" target="_blank" rel="noopener" href="https://www.konkurrensverket.se/upphandling/registrerade-annonsdatabaser/annonsdatabasregistret/">↗ Konkurrensverket – register över registrerade annonsdatabaser</a><a class="source" target="_blank" rel="noopener" href="https://www.upphandlingsmyndigheten.se/inkopsprocessen/forbered-upphandling/valja-upphandlingsforfarande/dynamiskt-inkopssystem/">↗ Upphandlingsmyndigheten – dynamiskt inköpssystem</a><a class="source" target="_blank" rel="noopener" href="https://www.upphandlingsmyndigheten.se/gora-affarer-med-offentlig-sektor/fragor-och-svar-vid-upphandling/">↗ Upphandlingsmyndigheten – Frågor och svar vid upphandling</a><a class="source" target="_blank" rel="noopener" href="https://www.upphandlingsmyndigheten.se/inkopsprocessen/genomfor-upphandlingen/rattelse-fortydligande-och-komplettering/">↗ Upphandlingsmyndigheten – Rättelse, förtydligande och komplettering</a></article>`}
function fundingBlock(){return `<article class="result"><span class="tag">Finansiering / företagsstöd</span><h3>Sök brett – verifiera varje faktisk möjlighet</h3><p>Det finns inte ett generellt bidrag som alla företag kan få. Stöd och finansiering beror på bland annat företagets situation, investering, bransch, plats och syftet med satsningen.</p><ul class="checklist"><li>Börja i officiella söktjänster och filtrera på plats, bransch och typ av stöd.</li><li>Öppna sedan den primära utlysningen och kontrollera målgrupp, villkor, egen finansiering, period och ansökningsväg.</li><li>Stödassistenten ska senare kunna göra denna kontroll mot er företagsprofil, men får aldrig skapa ett bidrag som inte finns.</li></ul><a class="source" target="_blank" rel="noopener" href="https://verksamt.se/node/674">↗ verksamt.se – Hitta rådgivning och finansiering</a><a class="source" target="_blank" rel="noopener" href="https://verksamt.se/finansiering-radgivning/offentlig-finansiering">↗ verksamt.se – Att söka offentlig finansiering</a></article>`}
function readinessScore(){return [state.capacity,state.references,state.docs].filter(v=>v==='yes').length}
function companyActionPlan(){const items=[];const procurement=state.goal==='procurement'||state.goal==='both';if(procurement)items.push('Börja med rätt affärsväg: sök annonserade upphandlingar i flera registrerade annonsdatabaser och med relevanta CPV-koder, men kartlägg också relevanta offentliga köpare eftersom direktupphandlingar inte alltid annonseras. När ni hittar en konkret affär är det aktuella underlaget styrande. Om ett krav är oklart använder ni den officiella frågor-och-svar-kanalen i upphandlingen och följer publicerade rättelser/tillägg före inlämning.');if(state.goal==='funding'||state.goal==='both')items.push('Sök i officiella finansieringskällor, öppna den primära utlysningen och kontrollera målgrupp, syfte, period och ansökningsväg.');if(procurement)for(const gap of readiness())items.push('Beredskap: '+gap+'.');return `<section class="card"><h2>Gör så här nu</h2>${items.map(x=>`<div class="actionbox">${x}</div>`).join('')}<div class="notice">Stödassistenten ska hjälpa till att minska sökandet och strukturera nästa handling, men ett specifikt upphandlingsunderlag eller en primär stödutlysning är alltid styrande.</div></section>`}
function rate(key,val){feedback.ratings[key]=val;feedback.status='idle';render()}
function ratingRow(key,label){return `<div class="feedback-panel"><b>${label}</b><div class="fbs"><button class="fb ${feedback.ratings[key]===5?'selected':''}" onclick="rate('${key}',5)">Relevant</button><button class="fb ${feedback.ratings[key]===3?'selected':''}" onclick="rate('${key}',3)">Kände redan till</button><button class="fb ${feedback.ratings[key]===1?'selected':''}" onclick="rate('${key}',1)">Inte relevant</button></div></div>`}
function finalQuestion(key,label){return `<div class="finalq"><b>${label}</b><div class="fbs"><button class="fb ${feedback[key]===true?'selected':''}" onclick="feedback.${key}=true;feedback.status='idle';render()">Ja</button><button class="fb ${feedback[key]===false?'selected':''}" onclick="feedback.${key}=false;feedback.status='idle';render()">Nej</button></div></div>`}
function feedbackStatus(){if(feedback.status==='sending')return '<div class="status">Skickar feedback…</div>';if(feedback.status==='sent')return '<div class="status ok">✓ Tack! Din anonyma produktfeedback är sparad.</div>';if(feedback.status==='error')return '<div class="status err">Feedbacken kunde inte skickas just nu.</div>';if(feedback.status==='missing')return '<div class="status err">Svara på de tre frågorna innan du skickar.</div>';return ''}
function companyFeedback(){let ratings='';let n=1;if(state.goal==='procurement'||state.goal==='both')ratings+=ratingRow('m'+(n++),'Hur relevant var upphandlingsdelen?');if(state.goal==='funding'||state.goal==='both')ratings+=ratingRow('m'+(n++),'Hur relevant var finansieringsdelen?');return `<section class="card"><h2>Hjälp oss förbättra företagsspåret</h2><p class="muted">Företag ska kunna ge samma typ av produktfeedback som andra användare.</p>${ratings}${finalQuestion('new','Fick du reda på något nytt?')}${finalQuestion('useful','Var planen användbar för företaget?')}${finalQuestion('clear','Var nästa steg tydligt?')}<div class="privacy">🔒 Vi skickar inte sektor, geografi, kapacitet, referenser eller dokumentstatus. Bara produktversion, flöde och dina bedömningar skickas.</div><button class="btn primary" ${feedback.status==='sending'||feedback.status==='sent'?'disabled':''} onclick="submitCompanyFeedback()">Skicka anonym feedback</button>${feedbackStatus()}</section>`}
async function submitCompanyFeedback(){if(typeof feedback.new!=='boolean'||typeof feedback.useful!=='boolean'||typeof feedback.clear!=='boolean'){feedback.status='missing';render();return}feedback.status='sending';render();const payload={app_version:APP_VERSION,language:'sv',flow:'company',learned_new:feedback.new,useful:feedback.useful,next_step_clear:feedback.clear,ratings:feedback.ratings};try{const res=await fetch(FEEDBACK_ENDPOINT,{method:'POST',mode:'cors',credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!res.ok)throw new Error('HTTP '+res.status);feedback.status='sent'}catch(e){feedback.status='error'}render()}
function result(){const procurement=state.goal==='procurement'||state.goal==='both';const funding=state.goal==='funding'||state.goal==='both';const score=procurement?`<div class="score"><b>Beredskap ${readinessScore()} av 3</b><br><span class="muted">Kapacitet, referenser och vanliga företagsunderlag används här som enkel readiness-signal – inte som kvalificeringsbeslut.</span></div>`:'';return `${back()}<section class="card"><div class="eyebrow">Din första testplan</div><h1>${state.sector==='cleaning'?'Städbolag':state.sector==='construction'?'Bygg / entreprenad':state.sector==='consulting'?'Tjänsteföretag':'Företag'}</h1><p class="muted">Det här är ett pilotunderlag, inte ett beslut om stöd, kvalificering eller kontrakt.</p>${score}</section>${procurement?procurementBlock():''}${funding?fundingBlock():''}${companyActionPlan()}${companyFeedback()}<section class="card"><h3>Vad vi vill lära oss av testet</h3><div class="warn">När du testar: notera vad som var oklart, vilken verklig möjlighet du försökte hitta, vilket krav du fastnade på och vad du hade velat att Stödassistenten gjorde automatiskt. Dela inte personnummer, lösenord, konkurrerande anbud eller konfidentiell upphandlingsinformation.</div><button class="btn primary" onclick="reset()">Testa en ny företagssituation</button></section>`}
function render(){const f={0:start,1:goal,2:sector,3:geography,4:capacity,5:references,6:docs,7:result}[state.step];main.innerHTML=f()}
render();
</script>
</body>
</html>
