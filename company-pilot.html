<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ea">
<title>Stödassistenten – Företagspilot</title>
<style>
:root{--bg:#f7f3ea;--paper:#fffdf8;--ink:#26322e;--muted:#6e7772;--line:#e8dfd0;--sage:#35675c;--soft:#e9f1ed;--warm:#fff2d7;--rose:#fff0ea;--danger:#8d3e32}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:680px;margin:auto;padding:14px 14px 100px}.top{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 12px}.logo{font-weight:900}.pilot{font-size:11px;background:var(--warm);padding:6px 9px;border-radius:999px}.card{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:19px;margin:10px 0;box-shadow:0 8px 25px #40372a12}.hero{padding:23px 19px}h1{font-size:34px;line-height:1.06;margin:4px 0 10px}h2{font-size:24px;margin:0 0 12px}h3{margin:0 0 8px}p{line-height:1.5}.muted{color:var(--muted)}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--sage)}.choice,.btn{font:inherit;border:1px solid var(--line);background:white;color:var(--ink);border-radius:16px;padding:13px;cursor:pointer;font-weight:750}.choice{display:block;width:100%;text-align:start;margin:8px 0}.choice.active{background:var(--soft);border-color:#8fb5a8}.primary{background:var(--sage);color:white;border:0;width:100%;margin-top:10px}.primary:disabled{opacity:.5;cursor:not-allowed}.back{border:0;background:none;color:var(--sage);font-weight:800;padding:6px 0;cursor:pointer}.notice{background:var(--warm);border-radius:15px;padding:12px;font-size:13px}.privacy{background:var(--soft);border-radius:15px;padding:12px;font-size:13px}.progress{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:7px}.field{width:100%;font:inherit;border:1px solid var(--line);background:white;border-radius:16px;padding:13px;margin:8px 0;min-height:96px;resize:vertical}.result{border:1px solid var(--line);background:white;border-radius:19px;padding:15px;margin:9px 0}.tag{display:inline-block;background:var(--soft);color:#28584c;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900}.warn{background:var(--rose);border-radius:15px;padding:12px;font-size:13px}.checklist{padding-left:20px}.checklist li{margin:9px 0}.source{display:block;color:var(--sage);font-weight:800;text-decoration:none;margin:9px 0}.localnote{font-size:12px;color:var(--muted)}@media(max-width:420px){h1{font-size:30px}.app{padding-left:11px;padding-right:11px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="logo">🧭 Stödassistenten</div><div class="pilot">Företagspilot v0.1</div></div>
  <main id="main"></main>
</div>
<script>
const state={step:0,goal:null,sector:null,geography:null,capacity:null,references:null,docs:null,description:''};
const main=document.getElementById('main');
const steps=['start','goal','sector','geography','capacity','references','docs','description','result'];
function reset(){Object.assign(state,{step:0,goal:null,sector:null,geography:null,capacity:null,references:null,docs:null,description:''});render()}
function go(i){state.step=Math.max(0,Math.min(i,steps.length-1));window.scrollTo({top:0,behavior:'smooth'});render()}
function pick(key,val){state[key]=val;go(state.step+1)}
function btn(label,key,val){return `<button class="choice ${state[key]===val?'active':''}" onclick="pick('${key}','${val}')">${label}</button>`}
function back(){return state.step>0?`<button class="back" onclick="go(${state.step-1})">← Tillbaka</button>`:''}
function wrap(title,body){return `${back()}<section class="card"><div class="progress">Steg ${state.step} av 7</div><h2>${title}</h2>${body}</section>`}
function start(){return `<section class="card hero"><div class="eyebrow">Företag / offentlig marknad</div><h1>Från “det är ett hav” till en tydlig nästa plan.</h1><p class="muted">Den här tidiga företagspiloten hjälper dig strukturera vad du söker och vad som behöver vara på plats innan du går vidare. Den avgör inte om du vinner en upphandling eller får finansiering.</p><div class="privacy">🔒 Dina svar i den här v0.1-sidan stannar i webbläsaren och skickas inte till Stödassistenten.</div><button class="btn primary" onclick="go(1)">Starta företagstestet</button></section><section class="card"><h3>Viktigt</h3><div class="notice">Vi visar bara verkliga, verifierbara ingångar och officiella källor. Vi hittar inte på bidrag, finansiering eller upphandlingskrav. Ett specifikt upphandlingsdokument styr alltid över generella råd.</div></section>`}
function goal(){return wrap('Vad vill företaget främst göra?',btn('Hitta offentliga upphandlingar / lämna anbud','goal','procurement')+btn('Hitta finansiering eller företagsstöd','goal','funding')+btn('Båda','goal','both'))}
function sector(){return wrap('Vilken typ av verksamhet driver ni?',btn('Städ / lokalvård','sector','cleaning')+btn('Bygg / fastighet / entreprenad','sector','construction')+btn('Konsult / tjänster','sector','consulting')+btn('Annat','sector','other'))}
function geography(){return wrap('Var vill ni kunna ta uppdrag eller stöd?',btn('Främst lokalt / i min region','geography','local')+btn('Flera regioner','geography','multi')+btn('Hela Sverige','geography','national')+btn('Osäker','geography','unknown'))}
function capacity(){return wrap('Har ni koll på vilken kapacitet ni faktiskt kan lova?',btn('Ja – vi vet ungefär volym, bemanning och område','capacity','yes')+btn('Delvis','capacity','partial')+btn('Nej / behöver hjälp att räkna på det','capacity','no'))}
function references(){return wrap('Kan ni visa relevanta referenser eller tidigare uppdrag?',btn('Ja','references','yes')+btn('Några, men inte så strukturerat','references','partial')+btn('Nej / osäker','references','no'))}
function docs(){return wrap('Har ni samlat vanliga företagsunderlag på ett ställe?',`<p class="muted">Exempelvis registrerings-/skatteuppgifter, försäkringsunderlag, kvalitetsrutiner, referenser och andra bevis som kan efterfrågas. Vilka dokument som faktiskt krävs bestäms av den specifika upphandlingen eller stödutlysningen.</p>`+btn('Ja','docs','yes')+btn('Delvis','docs','partial')+btn('Nej / osäker','docs','no'))}
function description(){return wrap('Beskriv företaget med egna ord',`<textarea class="field" maxlength="500" placeholder="Exempel: Vi är ett städbolag med sex anställda i Stockholm. Vi städar kontor och trapphus och vill börja sälja till kommuner." oninput="state.description=this.value">${state.description}</textarea><div class="localnote">Max 500 tecken. Texten stannar lokalt i denna pilot.</div><button class="btn primary" onclick="go(8)">Skapa min testplan</button>`)}
function readiness(){let gaps=[];if(state.capacity!=='yes')gaps.push('göra kapacitet och geografiskt åtagande tydligare');if(state.references!=='yes')gaps.push('strukturera relevanta referenser och tidigare leveranser');if(state.docs!=='yes')gaps.push('samla vanliga företagsunderlag och bevis på ett ställe');return gaps}
function procurementBlock(){const gaps=readiness();return `<article class="result"><span class="tag">Offentlig upphandling</span><h3>Första readiness-bedömningen</h3>${gaps.length?`<p>Innan ni lägger mycket tid på anbud är det klokt att först ${gaps.join(', ')}.</p>`:`<p>Ni verkar ha en grund att utgå från. Nästa steg är att välja en verklig annonserad affär och kontrollera de specifika kraven rad för rad.</p>`}<ul class="checklist"><li>Bevaka relevanta affärer inom ert område och er geografi.</li><li>Läs alltid hela upphandlingsdokumentet och separera obligatoriska krav från sådant som utvärderas.</li><li>Skapa en checklista: krav → vilket bevis krävs → vem ansvarar → deadline.</li><li>Lämna inte ett anbud om ett obligatoriskt krav inte kan styrkas; markera i stället luckan för nästa affär.</li></ul><a class="source" target="_blank" rel="noopener" href="https://www.upphandlingsmyndigheten.se/gora-affarer-med-offentlig-sektor/hitta-affaren-i-offentlig-sektor">↗ Upphandlingsmyndigheten – Hitta affären i offentlig sektor</a><a class="source" target="_blank" rel="noopener" href="https://www.konkurrensverket.se/upphandling/registrerade-annonsdatabaser/annonsdatabasregistret/">↗ Konkurrensverket – register över registrerade annonsdatabaser</a></article>`}
function fundingBlock(){return `<article class="result"><span class="tag">Finansiering / företagsstöd</span><h3>Sök brett – verifiera varje faktisk möjlighet</h3><p>Det finns inte ett generellt bidrag som alla företag kan få. Stöd och finansiering beror på bland annat företagets situation, investering, bransch, plats och syftet med satsningen.</p><ul class="checklist"><li>Börja i officiella söktjänster och filtrera på plats, bransch och typ av stöd.</li><li>Öppna sedan den primära utlysningen och kontrollera målgrupp, villkor, egen finansiering, period och ansökningsväg.</li><li>Stödassistenten ska senare kunna göra denna kontroll mot er företagsprofil, men får aldrig skapa ett bidrag som inte finns.</li></ul><a class="source" target="_blank" rel="noopener" href="https://verksamt.se/node/674">↗ verksamt.se – Hitta rådgivning och finansiering</a><a class="source" target="_blank" rel="noopener" href="https://verksamt.se/finansiering-radgivning/offentlig-finansiering">↗ verksamt.se – Att söka offentlig finansiering</a></article>`}
function result(){const procurement=state.goal==='procurement'||state.goal==='both';const funding=state.goal==='funding'||state.goal==='both';return `${back()}<section class="card"><div class="eyebrow">Din första testplan</div><h1>${state.sector==='cleaning'?'Städbolag':state.sector==='construction'?'Bygg / entreprenad':state.sector==='consulting'?'Tjänsteföretag':'Företag'}</h1><p class="muted">Det här är ett pilotunderlag, inte ett beslut om stöd, kvalificering eller kontrakt.</p>${state.description?`<div class="privacy"><b>Din beskrivning:</b><br>${escapeHtml(state.description)}</div>`:''}</section>${procurement?procurementBlock():''}${funding?fundingBlock():''}<section class="card"><h3>Vad vi vill lära oss av testet</h3><div class="warn">När du testar: notera vad som var oklart, vilken verklig möjlighet du försökte hitta, vilket krav du fastnade på och vad du hade velat att Stödassistenten gjorde automatiskt. Dela inte personnummer, lösenord, konkurrerande anbud eller konfidentiell upphandlingsinformation.</div><button class="btn primary" onclick="reset()">Testa en ny företagssituation</button></section>`}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function render(){const f={0:start,1:goal,2:sector,3:geography,4:capacity,5:references,6:docs,7:description,8:result}[state.step];main.innerHTML=f()}
render();
</script>
</body>
</html>
