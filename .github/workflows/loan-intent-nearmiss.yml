name: Validate loan intent lexical boundary

on:
  pull_request:
    paths:
      - 'index.html'
      - 'client/privacy-routing.js'
      - 'scripts/build_public_pilot.py'
      - 'scripts/test_loan_intent_nearmiss_browser.py'
      - '.github/workflows/loan-intent-nearmiss.yml'
  push:
    branches: ['main']
    paths:
      - 'index.html'
      - 'client/privacy-routing.js'
      - 'scripts/build_public_pilot.py'
      - 'scripts/test_loan_intent_nearmiss_browser.py'
      - '.github/workflows/loan-intent-nearmiss.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Financial loan intent lexical boundary — Chromium
        env:
          BROWSER_ENGINE: chromium
        run: python scripts/test_loan_intent_nearmiss_browser.py . loan-intent-chromium.json
      - name: Financial loan intent lexical boundary — Playwright WebKit
        env:
          BROWSER_ENGINE: webkit
        run: python scripts/test_loan_intent_nearmiss_browser.py . loan-intent-webkit.json
      - name: Preserve loan intent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loan-intent-nearmiss-evidence
          path: |
            loan-intent-chromium.json
            loan-intent-webkit.json
          if-no-files-found: warn
          retention-days: 14
