name: Validate child care cost runtime v87

on:
  push:
    branches: [main]
    paths:
      - 'config/situation_session_contract.json'
      - 'client/situation-session-contract.js'
      - 'client/child-assistance-context-extension.js'
      - 'client/child-assistance-context-extension.test.cjs'
      - 'data/evals/scenario_lab_websignals_v86.json'
      - 'data/evals/demand_friction_regression_map_v86.json'
      - 'data/supports/se-forsakringskassan-omvardnadsbidrag.json'
      - 'data/supports/se-forsakringskassan-merkostnadsersattning-barn.json'
      - 'docs/PILOT_COVERAGE_MATRIX_V87_APPENDIX.md'
      - 'scripts/validate_child_care_cost_runtime_v87.py'
      - '.github/workflows/child-care-cost-runtime-v87.yml'
  pull_request:
    paths:
      - 'config/situation_session_contract.json'
      - 'client/situation-session-contract.js'
      - 'client/child-assistance-context-extension.js'
      - 'client/child-assistance-context-extension.test.cjs'
      - 'data/evals/scenario_lab_websignals_v86.json'
      - 'data/evals/demand_friction_regression_map_v86.json'
      - 'data/supports/se-forsakringskassan-omvardnadsbidrag.json'
      - 'data/supports/se-forsakringskassan-merkostnadsersattning-barn.json'
      - 'docs/PILOT_COVERAGE_MATRIX_V87_APPENDIX.md'
      - 'scripts/validate_child_care_cost_runtime_v87.py'
      - '.github/workflows/child-care-cost-runtime-v87.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python scripts/validate_child_care_cost_runtime_v87.py
