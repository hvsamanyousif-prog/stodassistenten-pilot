name: Validate child assistance truth v84

on:
  push:
    branches: [main, 'automation/**', 'work/**', 'ai/**']
    paths:
      - 'data/supports/se-forsakringskassan-assistansersattning-barn.json'
      - 'data/supports/se-forsakringskassan-assistansersattning-vuxna.json'
      - 'data/evals/scenario_lab_websignals_v84.json'
      - 'scripts/validate_child_assistance_v84.py'
      - '.github/workflows/child-assistance-v84.yml'
  pull_request:
    paths:
      - 'data/supports/se-forsakringskassan-assistansersattning-barn.json'
      - 'data/supports/se-forsakringskassan-assistansersattning-vuxna.json'
      - 'data/evals/scenario_lab_websignals_v84.json'
      - 'scripts/validate_child_assistance_v84.py'
      - '.github/workflows/child-assistance-v84.yml'

permissions:
  contents: read

jobs:
  child-assistance-v84:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical support records
        run: python scripts/validate_support_records.py --self-test
      - name: Re-run the shared scenario factory
        run: python scripts/validate_scenario_lab_all.py
      - name: Validate v84 child assistance truth and red-team boundaries
        run: python scripts/validate_child_assistance_v84.py
      - name: Scan public repository boundary
        run: python scripts/validate_public_repo_boundary.py .
