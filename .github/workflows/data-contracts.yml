name: Validate ingestion data contracts

on:
  push:
    paths:
      - 'data/**'
      - 'scripts/validate_data.py'
      - '.github/workflows/data-contracts.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/validate_data.py'
      - '.github/workflows/data-contracts.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate public ingestion metadata
        run: python scripts/validate_data.py
