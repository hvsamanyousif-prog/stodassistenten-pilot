name: Deploy Stodassistenten Pilot to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build minimal public pilot artifact
        run: python scripts/build_public_pilot.py --output _site
      - name: Verify capability wiring before deployment
        run: python scripts/test_public_pilot_build.py --site _site
      - name: Verify procurement expert pilot
        run: |
          python scripts/test_procurement_expert_pilot.py
          node --check client/procurement-expert-pilot.js
          cp procurement-expert-pilot.html _site/
          mkdir -p _site/client
          cp client/procurement-expert-pilot.js _site/client/
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
