name: Validate Fritidskortet deadline v90

on:
  push:
    branches: [main]
    paths:
      - 'data/evals/fritidskortet_truth_guard_v89.json'
      - 'data/evals/scenario_lab_fritidskort_deadline_v90.json'
      - 'scripts/validate_fritidskortet_deadline_v90.py'
      - '.github/workflows/fritidskortet-deadline-v90.yml'
  pull_request:
    paths:
      - 'data/evals/fritidskortet_truth_guard_v89.json'
      - 'data/evals/scenario_lab_fritidskort_deadline_v90.json'
      - 'scripts/validate_fritidskortet_deadline_v90.py'
      - '.github/workflows/fritidskortet-deadline-v90.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate proposal versus active deadline boundary
        run: python scripts/validate_fritidskortet_deadline_v90.py
