name: Validate start-page vision lexical boundary

on:
  pull_request:
    paths:
      - 'index.html'
      - 'client/privacy-routing.js'
      - 'scripts/build_public_pilot.py'
      - 'scripts/test_start_vision_boundary_browser.py'
      - '.github/workflows/start-vision-boundary.yml'
  push:
    branches: ['main']
    paths:
      - 'index.html'
      - 'client/privacy-routing.js'
      - 'scripts/build_public_pilot.py'
      - 'scripts/test_start_vision_boundary_browser.py'
      - '.github/workflows/start-vision-boundary.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Vision lexical boundary — Chromium
        env:
          BROWSER_ENGINE: chromium
          EVIDENCE_PATH: start-vision-boundary-chromium.json
        run: python scripts/test_start_vision_boundary_browser.py
      - name: Vision lexical boundary — Playwright WebKit
        if: always()
        env:
          BROWSER_ENGINE: webkit
          EVIDENCE_PATH: start-vision-boundary-webkit.json
        run: python scripts/test_start_vision_boundary_browser.py
      - name: Preserve vision boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: start-vision-boundary-evidence
          path: |
            start-vision-boundary-chromium.json
            start-vision-boundary-webkit.json
          if-no-files-found: warn
          retention-days: 14
