name: Validate unified platform shell

on:
  pull_request:
    paths:
      - 'index.html'
      - 'person-pilot.html'
      - 'company-pilot.html'
      - 'scripts/validate_unified_shell.py'
      - '.github/workflows/unified-shell.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'person-pilot.html'
      - 'company-pilot.html'
      - 'scripts/validate_unified_shell.py'
      - '.github/workflows/unified-shell.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_unified_shell.py
