name: Source universe v73 local and collective coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-universe-v73:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate shared source universe and new authority boundaries
        run: |
          python scripts/validate_source_universe_v69.py
          python scripts/validate_source_universe_v73.py
          python scripts/validate_foundation_discovery.py
          python scripts/validate_data.py
          python scripts/validate_scenario_lab_all.py
          python scripts/validate_public_repo_boundary.py
