name: One-shot fix duplicate result copy

on:
  push:
    branches: ["fix/result-card-duplicate-copy"]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/result-card-duplicate-copy
      - name: Remove duplicated result description
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('person-pilot.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="rhead"><b>${r[0]}</b><span class="tag">${tr(i<2?\'good\':\'check\')}</span></div><p>${r[1]}</p><div class="info"><b>${tr(\'why\')}</b><br>${r[1]}</div>'
          new = '<div class="rhead"><b>${r[0]}</b><span class="tag">${tr(i<2?\'good\':\'check\')}</span></div><div class="info"><b>${tr(\'why\')}</b><br>${r[1]}</div>'
          if old not in s:
              raise SystemExit('expected duplicate result-card pattern not found')
          if s.count(old) != 1:
              raise SystemExit('expected exactly one duplicate result-card pattern')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Add regression check
        run: |
          cat > scripts/test_result_card_copy.py <<'PY'
          from pathlib import Path
          html = Path('person-pilot.html').read_text(encoding='utf-8')
          duplicate = '<p>${r[1]}</p><div class="info"><b>${tr(\'why\')}</b><br>${r[1]}</div>'
          if duplicate in html:
              raise SystemExit('duplicate result description is back')
          if '<div class="info"><b>${tr(\'why\')}</b><br>${r[1]}</div>' not in html:
              raise SystemExit('result explanation missing')
          print('result-card copy regression: OK')
          PY
          python scripts/test_result_card_copy.py
      - name: Remove one-shot workflow and commit fix
        run: |
          rm .github/workflows/one-shot-fix-result-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add person-pilot.html scripts/test_result_card_copy.py .github/workflows/one-shot-fix-result-copy.yml
          git commit -m "Fix: remove duplicated result-card description"
          git push origin HEAD:fix/result-card-duplicate-copy
