name: Foundation discovery boundary

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source-universe and foundation discovery boundary
        run: |
          python scripts/validate_foundation_discovery.py
          python scripts/validate_data.py
          python scripts/validate_scenario_lab_all.py
