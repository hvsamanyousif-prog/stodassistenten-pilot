name: Validate feedback coverage
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/validate_feedback_coverage.py
      - name: Preserve identity and test numeric rating payload expressions
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p feedback-evidence
          python -c 'import json,os,subprocess; from pathlib import Path; Path("feedback-evidence/identity.json").write_text(json.dumps({"head_sha":os.environ["PR_HEAD"],"base_sha":os.environ["PR_BASE"],"tested_integration_sha":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"level":"source_expression_not_browser_http_or_database"},indent=2))'
          set -o pipefail
          node scripts/test_feedback_rating_payloads.cjs | tee feedback-evidence/payload-results.json
      - name: Preserve bounded regression evidence even when red
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feedback-rating-payload-evidence
          path: feedback-evidence/
          retention-days: 30
          if-no-files-found: warn
