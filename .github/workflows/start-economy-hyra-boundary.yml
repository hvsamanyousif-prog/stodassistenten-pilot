name: Validate start-page hyra boundary

on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/build_public_pilot.py'
      - 'scripts/test_start_economy_hyra_boundary_browser.py'
      - '.github/workflows/start-economy-hyra-boundary.yml'
  push:
    branches: ['main']
    paths:
      - 'index.html'
      - 'scripts/build_public_pilot.py'
      - 'scripts/test_start_economy_hyra_boundary_browser.py'
      - '.github/workflows/start-economy-hyra-boundary.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Start-page rent semantics — Chromium
        env:
          BROWSER_ENGINE: chromium
        run: python scripts/test_start_economy_hyra_boundary_browser.py . start-economy-hyra-chromium.json
      - name: Start-page rent semantics — Playwright WebKit
        env:
          BROWSER_ENGINE: webkit
        run: python scripts/test_start_economy_hyra_boundary_browser.py . start-economy-hyra-webkit.json
      - name: Preserve start-page rent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: start-economy-hyra-evidence
          path: |
            start-economy-hyra-chromium.json
            start-economy-hyra-webkit.json
          if-no-files-found: warn
          retention-days: 14
