name: One-shot platform depth and company feedback

on:
  push:
    branches: ["build/platform-depth-feedback-v01"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/platform-depth-feedback-v01
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch platform
        run: python scripts/one_shot_platform_depth.py
      - name: Commit platform content changes
        run: |
          rm -f .github/workflows/platform-depth.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html person-pilot.html company-pilot.html scripts/test_platform_depth.py
          git commit -m "Build: deepen platform UX and company feedback"
          git push origin HEAD:build/platform-depth-feedback-v01
