name: Validate procurement expert pilot

on:
  pull_request:
    paths:
      - 'index.html'
      - 'person-pilot.html'
      - 'company-pilot.html'
      - 'procurement-expert-pilot.html'
      - 'client/procurement-expert-pilot.js'
      - 'client/privacy-routing.js'
      - 'client/funding-intent-continuity.js'
      - 'client/concrete-need-continuity.js'
      - 'scripts/build_public_pilot.py'
      - 'scripts/test_procurement_expert_*.py'
      - 'scripts/test_shared_search_browser.py'
      - 'scripts/test_shared_search_keyword_inventory_browser.py'
      - 'scripts/test_funding_negation_browser.py'
      - 'scripts/test_combined_need_funding_browser.py'
      - 'scripts/test_relative_pronoun_need_browser.py'
      - 'scripts/test_funding_continuity_browser.py'
      - 'scripts/test_relative_funding_continuity.py'
      - '.github/workflows/procurement-expert-pilot.yml'
      - '.github/workflows/pages.yml'
  push:
    branches: ['main']
    paths:
      - 'index.html'
      - 'person-pilot.html'
      - 'company-pilot.html'
      - 'procurement-expert-pilot.html'
      - 'client/procurement-expert-pilot.js'
      - 'client/privacy-routing.js'
      - 'client/funding-intent-continuity.js'
      - 'client/concrete-need-continuity.js'
      - 'scripts/build_public_pilot.py'
      - 'scripts/test_procurement_expert_*.py'
      - 'scripts/test_shared_search_browser.py'
      - 'scripts/test_shared_search_keyword_inventory_browser.py'
      - 'scripts/test_funding_negation_browser.py'
      - 'scripts/test_combined_need_funding_browser.py'
      - 'scripts/test_relative_pronoun_need_browser.py'
      - 'scripts/test_funding_continuity_browser.py'
      - 'scripts/test_relative_funding_continuity.py'
      - '.github/workflows/procurement-expert-pilot.yml'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run expert-pilot behavior and privacy contracts
        run: python scripts/test_procurement_expert_pilot.py
      - name: Deadline process-event contracts
        run: python scripts/test_procurement_expert_process_events.py
      - name: Short feedback meaning contract
        run: python scripts/test_procurement_expert_feedback_semantics.py
      - name: Composite requirement-row contracts
        run: python scripts/test_procurement_expert_composite_rows.py
      - name: Relation-group segmentation contracts
        run: python scripts/test_procurement_expert_relation_groups.py
      - name: Commercial currency version contracts
        run: python scripts/test_procurement_expert_currency_versions.py
      - name: Source/link ingress boundary
        run: python scripts/test_procurement_expert_source_ingress.py
      - name: Priority overview regression
        run: python scripts/test_procurement_expert_priority.py
      - name: Check shared funding continuity runtime syntax
        run: node --check client/funding-intent-continuity.js
      - name: Check concrete-need continuity runtime syntax
        run: node --check client/concrete-need-continuity.js
      - name: Install isolated browser test tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Feedback state machine — Chromium
        env:
          BROWSER_ENGINE: chromium
        run: python scripts/test_procurement_expert_feedback_state.py . procurement-feedback-state-chromium.json
      - name: Feedback state machine — Playwright WebKit
        env:
          BROWSER_ENGINE: webkit
        run: python scripts/test_procurement_expert_feedback_state.py . procurement-feedback-state-webkit.json
      - name: Shared start/search journeys — Chromium
        env:
          BROWSER_ENGINE: chromium
        run: python scripts/test_shared_search_browser.py . shared-search-chromium.json
      - name: Shared start/search journeys — Playwright WebKit
        env:
          BROWSER_ENGINE: webkit
        run: python scripts/test_shared_search_browser.py . shared-search-webkit.json
      - name: Shared-search keyword inventory — Chromium
        env:
          BROWSER_ENGINE: chromium
          EVIDENCE_PATH: shared-search-keyword-inventory-chromium.json
        run: python scripts/test_shared_search_keyword_inventory_browser.py
      - name: Shared-search keyword inventory — Playwright WebKit
        if: always()
        env:
          BROWSER_ENGINE: webkit
          EVIDENCE_PATH: shared-search-keyword-inventory-webkit.json
        run: python scripts/test_shared_search_keyword_inventory_browser.py
      - name: Explicit funding-type negation — Chromium
        env:
          BROWSER_ENGINE: chromium
          EVIDENCE_PATH: funding-negation-chromium.json
        run: python scripts/test_funding_negation_browser.py
      - name: Explicit funding-type negation — Playwright WebKit
        if: always()
        env:
          BROWSER_ENGINE: webkit
          EVIDENCE_PATH: funding-negation-webkit.json
        run: python scripts/test_funding_negation_browser.py
      - name: Combined concrete need + funding intent — Chromium
        env:
          BROWSER_ENGINE: chromium
        run: python scripts/test_combined_need_funding_browser.py . combined-need-funding-chromium.json
      - name: Combined concrete need + funding intent — Playwright WebKit
        env:
          BROWSER_ENGINE: webkit
        run: python scripts/test_combined_need_funding_browser.py . combined-need-funding-webkit.json
      - name: Helped-person pronoun need continuity — Chromium
        env:
          BROWSER_ENGINE: chromium
        run: python scripts/test_relative_pronoun_need_browser.py . relative-pronoun-need-chromium.json
      - name: Helped-person pronoun need continuity — Playwright WebKit
        env:
          BROWSER_ENGINE: webkit
        run: python scripts/test_relative_pronoun_need_browser.py . relative-pronoun-need-webkit.json
      - name: Relative/helper funding continuity — Chromium
        env:
          BROWSER_ENGINE: chromium
        run: python scripts/test_relative_funding_continuity.py . relative-funding-chromium.json
      - name: Relative/helper funding continuity — Playwright WebKit
        env:
          BROWSER_ENGINE: webkit
        run: python scripts/test_relative_funding_continuity.py . relative-funding-webkit.json
      - name: Funding handoff destinations — Chromium
        env:
          BROWSER_ENGINE: chromium
        run: python scripts/test_funding_continuity_browser.py . funding-continuity-chromium.json
      - name: Funding handoff destinations — Playwright WebKit
        env:
          BROWSER_ENGINE: webkit
        run: python scripts/test_funding_continuity_browser.py . funding-continuity-webkit.json
      - name: Deadline/version source-truth — Chromium
        env:
          BROWSER_ENGINE: chromium
        run: python scripts/test_procurement_expert_deadline_browser.py . procurement-deadline-chromium.json
      - name: Deadline/version source-truth — Playwright WebKit
        env:
          BROWSER_ENGINE: webkit
        run: python scripts/test_procurement_expert_deadline_browser.py . procurement-deadline-webkit.json
      - name: Deadline process-event source-truth — Chromium
        env:
          BROWSER_ENGINE: chromium
        run: python scripts/test_procurement_expert_process_events_browser.py . procurement-process-events-chromium.json
      - name: Deadline process-event source-truth — Playwright WebKit
        env:
          BROWSER_ENGINE: webkit
        run: python scripts/test_procurement_expert_process_events_browser.py . procurement-process-events-webkit.json
      - name: Contrastive process-deadline truth — Chromium
        env:
          BROWSER_ENGINE: chromium
        run: python scripts/test_procurement_expert_deadline_contrast_browser.py . procurement-deadline-contrast-chromium.json
      - name: Contrastive process-deadline truth — Playwright WebKit
        env:
          BROWSER_ENGINE: webkit
        run: python scripts/test_procurement_expert_deadline_contrast_browser.py . procurement-deadline-contrast-webkit.json
      - name: Priority source-risk retention — Chromium
        env:
          BROWSER_ENGINE: chromium
        run: python scripts/test_procurement_expert_priority_browser.py . procurement-priority-chromium.json
      - name: Priority source-risk retention — Playwright WebKit
        env:
          BROWSER_ENGINE: webkit
        run: python scripts/test_procurement_expert_priority_browser.py . procurement-priority-webkit.json
      - name: Explicit-currency source-risk retention — Chromium
        env:
          BROWSER_ENGINE: chromium
        run: python scripts/test_procurement_expert_currency_browser.py . procurement-currency-chromium.json
      - name: Explicit-currency source-risk retention — Playwright WebKit
        env:
          BROWSER_ENGINE: webkit
        run: python scripts/test_procurement_expert_currency_browser.py . procurement-currency-webkit.json
      - name: Composite requirement-row source-risk — Chromium
        env:
          BROWSER_ENGINE: chromium
        run: python scripts/test_procurement_expert_composite_browser.py . procurement-composite-chromium.json
      - name: Composite requirement-row source-risk — Playwright WebKit
        env:
          BROWSER_ENGINE: webkit
        run: python scripts/test_procurement_expert_composite_browser.py . procurement-composite-webkit.json
      - name: Relation-group source-risk — Chromium
        env:
          BROWSER_ENGINE: chromium
        run: python scripts/test_procurement_expert_relation_groups_browser.py . procurement-relation-groups-chromium.json
      - name: Relation-group source-risk — Playwright WebKit
        env:
          BROWSER_ENGINE: webkit
        run: python scripts/test_procurement_expert_relation_groups_browser.py . procurement-relation-groups-webkit.json
      - name: Offline Chromium interactions (no live storage claim)
        env:
          CHROMIUM_PATH: /nonexistent/use-playwright-installed-browser
        run: python scripts/test_procurement_expert_browser.py . procurement-browser-audit.json
      - name: Supplier journeys and five-width matrix — Chromium
        env:
          BROWSER_ENGINE: chromium
        run: python scripts/test_procurement_expert_quality_matrix.py . procurement-quality-chromium.json
      - name: Supplier journeys and five-width matrix — Playwright WebKit
        env:
          BROWSER_ENGINE: webkit
        run: python scripts/test_procurement_expert_quality_matrix.py . procurement-quality-webkit.json
      - name: Preserve scoped browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procurement-offline-browser-evidence
          path: |
            procurement-feedback-state-chromium.json
            procurement-feedback-state-webkit.json
            shared-search-chromium.json
            shared-search-webkit.json
            shared-search-keyword-inventory-chromium.json
            shared-search-keyword-inventory-webkit.json
            funding-negation-chromium.json
            funding-negation-webkit.json
            combined-need-funding-chromium.json
            combined-need-funding-webkit.json
            relative-pronoun-need-chromium.json
            relative-pronoun-need-webkit.json
            relative-funding-chromium.json
            relative-funding-webkit.json
            funding-continuity-chromium.json
            funding-continuity-webkit.json
            procurement-deadline-chromium.json
            procurement-deadline-webkit.json
            procurement-process-events-chromium.json
            procurement-process-events-webkit.json
            procurement-deadline-contrast-chromium.json
            procurement-deadline-contrast-webkit.json
            procurement-priority-chromium.json
            procurement-priority-webkit.json
            procurement-currency-chromium.json
            procurement-currency-webkit.json
            procurement-composite-chromium.json
            procurement-composite-webkit.json
            procurement-relation-groups-chromium.json
            procurement-relation-groups-webkit.json
            procurement-browser-audit.json
            procurement-quality-chromium.json
            procurement-quality-webkit.json
          if-no-files-found: warn
