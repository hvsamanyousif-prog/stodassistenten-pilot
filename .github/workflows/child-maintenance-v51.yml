name: Child maintenance v51

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-child-maintenance-v51:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check same-product child maintenance guidance
        run: |
          node --check client/child-maintenance-guidance.js
          node tests/test_child_maintenance_guidance.js
      - name: Validate v51 semantic truth and regression guards
        run: python scripts/validate_child_maintenance_v51.py
      - name: Validate canonical scenario system
        run: python scripts/validate_scenario_lab_all.py
      - name: Validate demand friction learning loop
        run: python scripts/validate_demand_friction_learning_loop.py
      - name: Build public pilot with same route
        run: |
          python scripts/build_public_pilot.py --output _site-v51
          grep -q 'client/child-maintenance-guidance.js' _site-v51/index.html
          grep -q 'client/child-maintenance-guidance.js' _site-v51/person-pilot.html
