name: Validate company actor correction

on:
  pull_request:
    paths:
      - 'index.html'
      - 'client/privacy-routing.js'
      - 'scripts/build_public_pilot.py'
      - 'scripts/test_shared_search_browser.py'
      - 'scripts/test_actor_correction_company_browser.py'
      - 'scripts/test_actor_target_scope_browser.py'
      - '.github/workflows/actor-correction-company.yml'
  push:
    branches: ['main']
    paths:
      - 'index.html'
      - 'client/privacy-routing.js'
      - 'scripts/build_public_pilot.py'
      - 'scripts/test_shared_search_browser.py'
      - 'scripts/test_actor_correction_company_browser.py'
      - 'scripts/test_actor_target_scope_browser.py'
      - '.github/workflows/actor-correction-company.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Company actor correction — Chromium
        env:
          BROWSER_ENGINE: chromium
        run: python scripts/test_actor_target_scope_browser.py . actor-correction-company-chromium.json
      - name: Company actor correction — Playwright WebKit
        if: always()
        env:
          BROWSER_ENGINE: webkit
        run: python scripts/test_actor_target_scope_browser.py . actor-correction-company-webkit.json
      - name: Preserve company actor-correction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actor-correction-company-evidence
          path: |
            actor-correction-company-chromium.json
            actor-correction-company-webkit.json
          if-no-files-found: warn
          retention-days: 14
