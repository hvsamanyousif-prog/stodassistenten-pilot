name: Validate scholarship spelling boundary

on:
  pull_request:
    paths:
      - 'index.html'
      - 'client/privacy-routing.js'
      - 'scripts/build_public_pilot.py'
      - 'scripts/test_shared_search_browser.py'
      - 'scripts/test_funding_spelling_boundary_browser.py'
      - '.github/workflows/funding-spelling-boundary.yml'
  push:
    branches: ['main']
    paths:
      - 'index.html'
      - 'client/privacy-routing.js'
      - 'scripts/build_public_pilot.py'
      - 'scripts/test_shared_search_browser.py'
      - 'scripts/test_funding_spelling_boundary_browser.py'
      - '.github/workflows/funding-spelling-boundary.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Scholarship spelling boundary — Chromium
        env:
          BROWSER_ENGINE: chromium
          EVIDENCE_PATH: funding-spelling-boundary-chromium.json
        run: python scripts/test_funding_spelling_boundary_browser.py
      - name: Scholarship spelling boundary — Playwright WebKit
        if: always()
        env:
          BROWSER_ENGINE: webkit
          EVIDENCE_PATH: funding-spelling-boundary-webkit.json
        run: python scripts/test_funding_spelling_boundary_browser.py
      - name: Preserve scholarship spelling boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funding-spelling-boundary-evidence
          path: |
            funding-spelling-boundary-chromium.json
            funding-spelling-boundary-webkit.json
          if-no-files-found: warn
          retention-days: 14
