name: Validate child assistance runtime v85

on:
  push:
    branches: [main]
    paths:
      - 'client/child-assistance-context-extension.js'
      - 'client/child-assistance-context-extension.test.cjs'
      - 'client/disability-home-support-guidance.js'
      - 'scripts/build_public_pilot.py'
      - 'scripts/validate_child_assistance_runtime_v85.py'
      - 'data/evals/scenario_lab_websignals_v85.json'
      - 'data/evals/demand_friction_signals_v85.json'
      - 'data/evals/demand_friction_regression_map_v85.json'
      - 'data/supports/se-forsakringskassan-assistansersattning-barn.json'
      - 'data/supports/se-forsakringskassan-assistansersattning-vuxna.json'
      - '.github/workflows/child-assistance-runtime-v85.yml'
  pull_request:
    paths:
      - 'client/child-assistance-context-extension.js'
      - 'client/child-assistance-context-extension.test.cjs'
      - 'client/disability-home-support-guidance.js'
      - 'scripts/build_public_pilot.py'
      - 'scripts/validate_child_assistance_runtime_v85.py'
      - 'data/evals/scenario_lab_websignals_v85.json'
      - 'data/evals/demand_friction_signals_v85.json'
      - 'data/evals/demand_friction_regression_map_v85.json'
      - 'data/supports/se-forsakringskassan-assistansersattning-barn.json'
      - 'data/supports/se-forsakringskassan-assistansersattning-vuxna.json'
      - '.github/workflows/child-assistance-runtime-v85.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python scripts/validate_child_assistance_runtime_v85.py
      - run: python scripts/build_public_pilot.py --source . --output _site-v85
      - name: Assert extension is in both shared public surfaces
        run: |
          grep -q 'client/child-assistance-context-extension.js' _site-v85/index.html
          grep -q 'client/child-assistance-context-extension.js' _site-v85/person-pilot.html
          test -f _site-v85/client/child-assistance-context-extension.js
