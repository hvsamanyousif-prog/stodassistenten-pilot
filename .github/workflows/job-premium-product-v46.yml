name: Job premium product v46

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-job-premium-product-v46:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test job premium public guidance
        run: node client/job-premium-guidance.test.cjs
      - name: Validate v46 learning and truth boundaries
        run: python scripts/validate_job_premium_product_v46.py
      - name: Build public pilot with shared route
        run: python scripts/build_public_pilot.py --output _site-v46
