name: Validate debt-counselling web signal
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'data/evals/scenario_lab_websignals_v06.json'
      - 'scripts/validate_websignal_v06.py'
      - '.github/workflows/websignal-v06.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_websignal_v06.py
