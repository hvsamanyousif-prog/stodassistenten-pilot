name: Validate cross-actor scenario lab
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'data/evals/scenario_lab_v01.json'
      - 'data/evals/scenario_lab_websignals*.json'
      - 'scripts/validate_scenario_lab.py'
      - 'scripts/validate_scenario_lab_all.py'
      - '.github/workflows/scenario-lab.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_scenario_lab_all.py
