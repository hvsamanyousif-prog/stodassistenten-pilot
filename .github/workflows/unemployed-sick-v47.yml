name: Unemployed sickness v47

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-unemployed-sickness-v47:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check guidance syntax and behavior
        run: |
          node --check client/unemployed-sick-guidance.js
          node client/unemployed-sick-guidance.test.cjs
      - name: Validate canonical scenario system
        run: python scripts/validate_scenario_lab_all.py
      - name: Validate demand friction learning loop
        run: python scripts/validate_demand_friction_learning_loop.py
      - name: Build public pilot with shared route
        run: python scripts/build_public_pilot.py --output _site-v47
