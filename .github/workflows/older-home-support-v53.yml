name: Older home support v53

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-older-home-support-v53:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shared older home support syntax and behavior
        run: |
          node --check client/older-home-support-guidance.js
          node client/older-home-support-guidance.test.cjs
      - name: Validate v53 safety semantics
        run: python scripts/validate_older_home_support_v53.py
      - name: Validate canonical scenario system
        run: python scripts/validate_scenario_lab_all.py
      - name: Validate demand friction learning loop
        run: python scripts/validate_demand_friction_learning_loop.py
      - name: Build public pilot with shared route
        run: |
          python scripts/build_public_pilot.py --output _site-v53
          grep -q 'client/older-home-support-guidance.js' _site-v53/index.html
          grep -q 'client/older-home-support-guidance.js' _site-v53/person-pilot.html
