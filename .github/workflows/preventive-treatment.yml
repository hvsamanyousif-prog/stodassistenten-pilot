name: Preventive treatment guidance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  preventive-treatment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate preventive treatment route and regression
        run: python scripts/validate_preventive_treatment.py
