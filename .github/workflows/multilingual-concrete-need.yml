name: Validate multilingual concrete need continuity

on:
  pull_request:
    paths:
      - 'index.html'
      - 'person-pilot.html'
      - 'client/privacy-routing.js'
      - 'client/funding-intent-continuity.js'
      - 'client/concrete-need-continuity.js'
      - 'scripts/build_public_pilot.py'
      - 'scripts/test_procurement_expert_multilingual_need_browser.py'
      - '.github/workflows/multilingual-concrete-need.yml'
  push:
    branches: ['main']
    paths:
      - 'index.html'
      - 'person-pilot.html'
      - 'client/privacy-routing.js'
      - 'client/funding-intent-continuity.js'
      - 'client/concrete-need-continuity.js'
      - 'scripts/build_public_pilot.py'
      - 'scripts/test_procurement_expert_multilingual_need_browser.py'
      - '.github/workflows/multilingual-concrete-need.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Arabic/Persian bounded need — Chromium
        env:
          BROWSER_ENGINE: chromium
        run: python scripts/test_procurement_expert_multilingual_need_browser.py . multilingual-need-chromium.json
      - name: Arabic/Persian bounded need — Playwright WebKit
        env:
          BROWSER_ENGINE: webkit
        run: python scripts/test_procurement_expert_multilingual_need_browser.py . multilingual-need-webkit.json
      - name: Preserve multilingual need evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multilingual-concrete-need-evidence
          path: |
            multilingual-need-chromium.json
            multilingual-need-webkit.json
          if-no-files-found: warn
          retention-days: 14
