name: Validate company pilot

on:
  pull_request:
    paths:
      - 'company-pilot.html'
      - 'scripts/validate_company_pilot.py'
      - '.github/workflows/company-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'company-pilot.html'
      - 'scripts/validate_company_pilot.py'
      - '.github/workflows/company-pilot.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/validate_company_pilot.py
