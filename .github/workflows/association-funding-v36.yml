name: Association funding v36

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  association-funding-v36:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate v36 association funding correction
        run: python scripts/validate_association_funding_v36.py
      - name: Validate canonical scenario lab
        run: python scripts/validate_scenario_lab_all.py
      - name: Validate demand and friction learning loop
        run: python scripts/validate_demand_friction_learning_loop.py
      - name: Validate public pilot build
        run: |
          python scripts/build_public_pilot.py --source . --output _site
          python scripts/test_public_pilot_build.py --source . --site _site
