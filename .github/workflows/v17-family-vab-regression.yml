name: Validate family routing and VAB overlap

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate family/VAB contracts
        run: python scripts/validate_v17_family_vab.py
      - name: Install isolated browser test tooling
        if: always()
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Unknown family age is not no — Chromium
        if: always()
        env:
          BROWSER_ENGINE: chromium
        run: python scripts/test_family_age_unknown_browser.py . family-age-unknown-chromium.json
      - name: Unknown family age is not no — Playwright WebKit
        if: always()
        env:
          BROWSER_ENGINE: webkit
        run: python scripts/test_family_age_unknown_browser.py . family-age-unknown-webkit.json
      - name: Preserve family age evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-age-unknown-browser-evidence
          path: |
            family-age-unknown-chromium.json
            family-age-unknown-webkit.json
          if-no-files-found: warn
          retention-days: 14
