name: Validate Fritidskortet v89

on:
  push:
    branches: [main]
    paths:
      - 'data/supports/se-fritidskortet-child-activities.json'
      - 'data/evals/scenario_lab_websignals_v89.json'
      - 'data/evals/demand_friction_signals_v89.json'
      - 'data/evals/demand_friction_regression_map_v89.json'
      - 'scripts/validate_fritidskortet_v89.py'
      - '.github/workflows/fritidskortet-v89.yml'
  pull_request:
    paths:
      - 'data/supports/se-fritidskortet-child-activities.json'
      - 'data/evals/scenario_lab_websignals_v89.json'
      - 'data/evals/demand_friction_signals_v89.json'
      - 'data/evals/demand_friction_regression_map_v89.json'
      - 'scripts/validate_fritidskortet_v89.py'
      - '.github/workflows/fritidskortet-v89.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Fritidskortet truth and regressions
        run: python scripts/validate_fritidskortet_v89.py
