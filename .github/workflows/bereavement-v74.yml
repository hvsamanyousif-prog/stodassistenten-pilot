name: Validate bereavement first action v74

on:
  push:
    branches: [main, 'work/**']
    paths:
      - 'client/bereavement-guidance.js'
      - 'client/bereavement-guidance.test.cjs'
      - 'data/evals/scenario_lab_websignals_v74.json'
      - 'data/evals/demand_friction_signals_v74.json'
      - 'data/evals/demand_friction_regression_map_v74.json'
      - 'data/source_registry.json'
      - 'data/source_universe.json'
      - 'docs/PILOT_COVERAGE_MATRIX_V74_APPENDIX.md'
      - 'scripts/validate_bereavement_v74.py'
      - 'scripts/build_public_pilot.py'
      - '.github/workflows/bereavement-v74.yml'
  pull_request:
    paths:
      - 'client/bereavement-guidance.js'
      - 'client/bereavement-guidance.test.cjs'
      - 'data/evals/scenario_lab_websignals_v74.json'
      - 'data/evals/demand_friction_signals_v74.json'
      - 'data/evals/demand_friction_regression_map_v74.json'
      - 'data/source_registry.json'
      - 'data/source_universe.json'
      - 'docs/PILOT_COVERAGE_MATRIX_V74_APPENDIX.md'
      - 'scripts/validate_bereavement_v74.py'
      - 'scripts/build_public_pilot.py'
      - '.github/workflows/bereavement-v74.yml'

permissions:
  contents: read

jobs:
  bereavement-v74:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and permanent regressions
        run: python scripts/validate_bereavement_v74.py
      - name: Build the same public Stödassistenten
        run: python scripts/build_public_pilot.py --output _site-v74
      - name: Confirm v74 runtime ships on both shared surfaces
        run: |
          grep -q 'client/bereavement-guidance.js' _site-v74/index.html
          grep -q 'client/bereavement-guidance.js' _site-v74/person-pilot.html
