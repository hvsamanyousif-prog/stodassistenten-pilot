name: Validate private prediction bridge

on:
  push:
    paths:
      - 'data/evals/**'
      - 'scripts/evaluate_matching.py'
      - 'scripts/evaluate_matching_segments.py'
      - 'scripts/evaluate_grounding.py'
      - 'scripts/evaluate_private_predictions.py'
      - 'scripts/generate_private_prediction_fixture.py'
      - '.github/workflows/private-prediction-bridge.yml'
  pull_request:
    paths:
      - 'data/evals/**'
      - 'scripts/evaluate_matching.py'
      - 'scripts/evaluate_matching_segments.py'
      - 'scripts/evaluate_grounding.py'
      - 'scripts/evaluate_private_predictions.py'
      - 'scripts/generate_private_prediction_fixture.py'
      - '.github/workflows/private-prediction-bridge.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile bridge scripts
        run: python -m py_compile scripts/evaluate_private_predictions.py scripts/generate_private_prediction_fixture.py
      - name: Validate bridge contract and rejection behavior
        run: python scripts/evaluate_private_predictions.py --validate-only --self-test
      - name: Generate deterministic synthetic CI fixture
        run: python scripts/generate_private_prediction_fixture.py --output /tmp/private_prediction_bridge.synthetic.json
      - name: Exercise matching, segment and grounding evaluators through bridge
        run: python scripts/evaluate_private_predictions.py --predictions /tmp/private_prediction_bridge.synthetic.json
