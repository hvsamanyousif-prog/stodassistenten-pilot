name: Validate shared-search keyword inventory

on:
  pull_request:
    paths:
      - 'index.html'
      - 'client/privacy-routing.js'
      - 'scripts/build_public_pilot.py'
      - 'scripts/test_shared_search_browser.py'
      - 'scripts/test_shared_search_keyword_inventory_browser.py'
      - '.github/workflows/shared-search-keyword-inventory.yml'
  push:
    branches: ['main']
    paths:
      - 'index.html'
      - 'client/privacy-routing.js'
      - 'scripts/build_public_pilot.py'
      - 'scripts/test_shared_search_browser.py'
      - 'scripts/test_shared_search_keyword_inventory_browser.py'
      - '.github/workflows/shared-search-keyword-inventory.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Shared-search keyword inventory — Chromium
        env:
          BROWSER_ENGINE: chromium
          EVIDENCE_PATH: shared-search-keyword-inventory-chromium.json
        run: python scripts/test_shared_search_keyword_inventory_browser.py
      - name: Shared-search keyword inventory — Playwright WebKit
        if: always()
        env:
          BROWSER_ENGINE: webkit
          EVIDENCE_PATH: shared-search-keyword-inventory-webkit.json
        run: python scripts/test_shared_search_keyword_inventory_browser.py
      - name: Preserve shared-search keyword inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-search-keyword-inventory-evidence
          path: |
            shared-search-keyword-inventory-chromium.json
            shared-search-keyword-inventory-webkit.json
          if-no-files-found: warn
          retention-days: 14
